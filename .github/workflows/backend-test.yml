name: Backend Test

on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libasound-dev libpipewire-0.3-dev
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm exec rsbuild build -m production

      - name: Copy favicon (Linux)
        if: runner.os == 'Linux'
        run: cp static/favicon.ico dist/favicon.ico

      - name: Copy favicon (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item static/favicon.ico dist/favicon.ico

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run backend tests
        run: cargo test -p log73-launcher -p radio-io
