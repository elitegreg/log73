schema: 2
contests:
  SC-QSO-PARTY (In State):
    name: South Carolina QSO Party (In State)
    modes:
      - SSB
      - FM
      - CW
      - DATA
      - RTTY
    value_sets:
      DX:
        use: dx
      Counties:
        values_from_file: south-carolina-counties.dat
      States:
        use: us-states
        exclude: [SC]
      Canadian Provinces:
        use: canadian-provinces
      Washington DC:
        use: district-of-columbia
    setup_fields:
      - id: param-county
        key: County
        label: County
        type: String:4
        required: true
        in_sets: [Counties]
      - id: header-category-mode
        preset: category-mode
        valid_values: [CW, FM, SSB, MIXED]
      - id: header-category-operator
        preset: category-operator
        valid_values: [SINGLE-OP, MULTI-OP, CHECKLOG]
      - id: header-category-power
        preset: category-power
        valid_values: [HIGH, LOW, QRP]
      - id: header-category-station
        preset: category-station
        valid_values: [FIXED, MOBILE, PORTABLE]
      - id: header-category-transmitter
        preset: category-transmitter
        valid_values: [ONE, UNLIMITED]
    exchange:
      - id: rst-sent
        preset: rst-sent
      - id: county-sent
        label: County
        type: String:4
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [Counties]
        source: County
      - id: rst-received
        preset: rst-received
      - id: exchange-received
        label: Exchange
        type: String:4
        adif: SRX_STRING
        direction: received
        in_sets: [Counties, States, Washington DC, Canadian Provinces, DX]
    scoring:
      qso_points:
        rules:
          [
            {
              id: qso-rule-1,
              when: { field: SRX_STRING, in_set: Counties },
              points: 2,
            },
            { id: qso-rule-2, points: 4 },
          ]
      dupe_key:
        - CALL
        - BAND
        - MODE
        - STX_STRING
        - SRX_STRING
      multipliers:
        - {
            id: mult-exchange,
            name: Exchange,
            field: SRX_STRING,
            key: [SRX_STRING, STX_STRING, BAND, MODE],
            in_sets: [Counties, States],
          }
      bonus_points:
        - {
            id: bonus-bonus-station,
            name: Bonus Station,
            field: CALL,
            key: [CALL, BAND, MODE, STX_STRING],
            values: { W4CAE: 350, WW4SF: 250, K4YTZ: 250 },
          }
    cabrillo:
      fixed_headers:
        - { id: fixed-category-band, name: CATEGORY-BAND, value: ALL }
      export_fields:
        - { id: export-club, preset: export-club-optional }
        - {
            id: export-email,
            key: EMAIL,
            label: Email,
            type: String:75,
            regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$',
            preserve_case: true,
          }
        - {
            id: export-location,
            key: LOCATION,
            label: Location,
            type: String:32,
            help_text: 'State, province, county or DX',
          }
        - {
            id: export-name,
            key: NAME,
            label: Name,
            type: String:75,
            preserve_case: true,
          }
        - {
            id: export-address,
            key: ADDRESS,
            label: Address,
            type: String:45,
            widget: textarea,
            max_lines: 6,
            preserve_case: true,
          }
        - { id: export-soapbox, preset: export-soapbox-optional }
    profiles:
      - hf-vhf-bands
  SC-QSO-PARTY:
    name: South Carolina QSO Party
    setup_fields:
      - id: param-county
        remove: true
      - id: param-state
        key: State
        label: State
        type: String:4
        required: true
        in_sets: [States, Washington DC, Canadian Provinces, DX]
        before: header-category-mode
      - id: header-category-mode
        after: param-state
    exchange:
      - id: county-sent
        remove: true
      - id: exchange-received
        remove: true
      - id: state-sent
        label: State
        type: String:4
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [States, Washington DC, Canadian Provinces, DX]
        source: State
        after: rst-sent
      - id: rst-received
        after: state-sent
      - id: county-received
        label: County
        type: String:4
        adif: SRX_STRING
        direction: received
        in_sets: [Counties]
        after: rst-received
    scoring:
      qso_points:
        rules: null
        points: 2
    extends: SC-QSO-PARTY (In State)
