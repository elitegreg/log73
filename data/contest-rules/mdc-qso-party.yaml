schema: 2
contests:
  MDC-QSO-PARTY (In State):
    name: Maryland-DC QSO Party (In State)
    modes:
      - CW
      - SSB
      - FM
    value_sets:
      DX:
        use: dx
      Counties:
        values_from_file: maryland-dc-counties.dat
      States:
        use: us-states
        exclude: [MD]
      Canadian Provinces:
        use: canadian-provinces
    setup_fields:
      - id: param-county
        key: County
        label: County
        type: String:3
        required: true
        in_sets: [Counties]
      - id: header-category-mode
        preset: category-mode
        default: MIXED
        valid_values: [CW, SSB, MIXED]
      - id: header-category-operator
        preset: category-operator
        default: SINGLE-OP
        valid_values: [SINGLE-OP, MULTI-OP, CHECKLOG]
      - id: header-category-power
        preset: category-power
        default: LOW
        valid_values: [HIGH, LOW, QRP]
      - id: header-category-station
        preset: category-station
        default: FIXED
        valid_values: [CLUB, ROVER, PORTABLE, MOBILE, FIXED]
      - id: header-category-transmitter
        preset: category-transmitter
        default: ONE
        valid_values: [ONE, UNLIMITED]
    exchange:
      - id: county-sent
        label: County
        type: String:3
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [Counties]
        source: County
      - id: location-received
        label: Location
        type: String:16
        adif: SRX_STRING
        direction: received
        regex: ^\S+$
        valid_values_or_regex: true
        in_sets: [Counties, States, Canadian Provinces]
    scoring:
      qso_points:
        rules: [{id: qso-rule-1, when: {field: MODE, values: [SSB, FM]}, points: 1}, {id: qso-rule-2, points: 3}]
      dupe_key:
        - CALL
        - BAND
        - MODE_CLASS
        - STX_STRING
        - SRX_STRING
      multipliers:
        - {id: mult-county, name: County, field: SRX_STRING, key: [SRX_STRING, STX_STRING], in_sets: [Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING, STX_STRING], in_sets: [States, Canadian Provinces]}
        - {id: mult-dxcc-country, name: DXCC Country, field: DXCC, key: [DXCC], exclude_values: ['1', '6', '110', '291']}
      bonus_points:
        - {id: bonus-bonus-station, name: Bonus Station, field: CALL, key: [CALL], values: {W3VPR: 50}}
      param_multipliers:
        - {id: param-mult-category-power, param: CATEGORY-POWER, values: {HIGH: 1, LOW: 2, QRP: 3}}
        - {id: param-mult-category-station, param: CATEGORY-STATION, values: {CLUB: 1, ROVER: 4, PORTABLE: 3, MOBILE: 2, FIXED: 1}}
      multiplier_count_bonus_points:
        - {id: count-bonus-county-bonus, name: County Bonus, multiplier: County, thresholds: {'13': 250, '25': 500}}
    cabrillo:
      fixed_headers:
        - {id: fixed-category-band, name: CATEGORY-BAND, value: ALL}
      export_fields:
        - {id: export-club, preset: export-club-optional}
        - {id: export-email, key: EMAIL, label: Email, type: String:75, regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$', preserve_case: true}
        - {id: export-location, key: LOCATION, label: Location, type: String:32, help_text: 'Maryland/DC jurisdiction, state, province, or country.'}
        - {id: export-name, key: NAME, label: Name, type: String:75, preserve_case: true}
        - {id: export-address, key: ADDRESS, label: Address, type: String:45, widget: textarea, max_lines: 6, preserve_case: true}
        - {id: export-soapbox, preset: export-soapbox-optional}
    metadata:
      source: >-
        https://www.w3vpr.org/sites/default/files/mdcqsoparty/Documents/Maryland-DC_QSO_Party_Rules_2020-03-04.pdf
      notes: >-
        The received exchange is an MDC jurisdiction, US state, Canadian province/territory, or
        country.
    profiles:
      - hf-bands
  MDC-QSO-PARTY:
    name: Maryland-DC QSO Party
    setup_fields:
      - id: param-county
        remove: true
      - id: param-location
        key: Location
        label: State, Province, or Country
        type: String:16
        required: true
        before: header-category-mode
      - id: header-category-mode
        after: param-location
    exchange:
      - id: county-sent
        remove: true
      - id: location-received
        remove: true
      - id: location-sent
        label: Location
        type: String:16
        adif: STX_STRING
        direction: sent
        fixed: true
        source: Location
      - id: county-received
        label: County
        type: String:3
        adif: SRX_STRING
        direction: received
        in_sets: [Counties]
        after: location-sent
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-dxcc-country, remove: true}
    metadata:
      notes: Outside-MDC stations may score only contacts with the 25 Maryland/DC jurisdictions.
    extends: MDC-QSO-PARTY (In State)
