contests:
  - id: 'MDC-QSO-PARTY (In State)'
    display_name: 'Maryland-DC QSO Party (In State)'
    allowed_bands: [160, 80, 40, 20, 15, 10]
    allowed_modes: ['CW', 'SSB', 'FM']
    scoring:
      qso_points:
        rules:
          - when:
              field: 'MODE'
              values: ['SSB', 'FM']
            points: 1
          - points: 3
      dupe_key:
        - 'CALL'
        - 'BAND'
        - 'MODE_CLASS'
        - 'STX_STRING'
        - 'SRX_STRING'
      multipliers:
        - name: 'County'
          field: 'SRX_STRING'
          key:
            - 'SRX_STRING'
            - 'STX_STRING'
          in_sets: ['Counties']
        - name: 'State'
          field: 'SRX_STRING'
          key:
            - 'SRX_STRING'
            - 'STX_STRING'
          in_sets: ['States', 'Canadian Provinces']
        - name: 'DXCC Country'
          field: 'DXCC'
          key: ['DXCC']
          exclude_values: ['1', '6', '110', '291']
      bonus_points:
        - name: 'Bonus Station'
          field: 'CALL'
          key: ['CALL']
          values:
            W3VPR: 50
      param_multipliers:
        - param: 'CATEGORY-POWER'
          values:
            HIGH: 1
            LOW: 2
            QRP: 3
        - param: 'CATEGORY-STATION'
          values:
            CLUB: 1
            ROVER: 4
            PORTABLE: 3
            MOBILE: 2
            FIXED: 1
      multiplier_count_bonus_points:
        - name: 'County Bonus'
          multiplier: 'County'
          thresholds:
            13: 250
            25: 500
    cabrillo:
      contest_id: 'MDC-QSO-PARTY'
      fixed_fields:
        - name: 'CATEGORY-BAND'
          value: 'ALL'
      log_fields:
        - name: 'CATEGORY-MODE'
          label: 'Category Mode'
          type: 'String:16'
          widget: 'select'
          default: 'MIXED'
          valid_values: ['CW', 'SSB', 'MIXED']
        - name: 'CATEGORY-OPERATOR'
          label: 'Category Operator'
          type: 'String:16'
          widget: 'select'
          default: 'SINGLE-OP'
          valid_values: ['SINGLE-OP', 'MULTI-OP', 'CHECKLOG']
        - name: 'CATEGORY-POWER'
          label: 'Category Power'
          type: 'String:16'
          widget: 'select'
          default: 'LOW'
          valid_values: ['HIGH', 'LOW', 'QRP']
        - name: 'CATEGORY-STATION'
          label: 'Category Station'
          type: 'String:16'
          widget: 'select'
          default: 'FIXED'
          valid_values: ['CLUB', 'ROVER', 'PORTABLE', 'MOBILE', 'FIXED']
        - name: 'CATEGORY-TRANSMITTER'
          label: 'Category Transmitter'
          type: 'String:16'
          widget: 'select'
          default: 'ONE'
          valid_values: ['ONE', 'UNLIMITED']
      export_fields:
        - name: 'CLUB'
          label: 'Club'
          type: 'String:75'
          required: false
          preserve_case: true
        - name: 'EMAIL'
          label: 'Email'
          type: 'String:75'
          regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          preserve_case: true
        - name: 'LOCATION'
          label: 'Location'
          type: 'String:32'
          help_text: 'Maryland/DC jurisdiction, state, province, or country.'
        - name: 'NAME'
          label: 'Name'
          type: 'String:75'
          preserve_case: true
        - name: 'ADDRESS'
          label: 'Address'
          type: 'String:45'
          widget: 'textarea'
          max_lines: 6
          preserve_case: true
        - name: 'SOAPBOX'
          label: 'Soapbox'
          type: 'String:75'
          widget: 'textarea'
          required: false
          preserve_case: true
    define:
      - name: 'DX'
        values:
          - DX
      - name: 'Counties'
        values:
          - ALY
          - ANA
          - BAL
          - BCT
          - CLV
          - CLN
          - CRL
          - CEC
          - CHS
          - DRC
          - FRD
          - GAR
          - HFD
          - HWD
          - KEN
          - MON
          - PGE
          - QAN
          - STM
          - SMR
          - TAL
          - WAS
          - WIC
          - WRC
          - WDC
      - name: 'States'
        values_from_file: us_states.dat
        exclude: ['MD']
      - name: 'Canadian Provinces'
        values_from_file: canadian_provinces.dat
    log_params:
      - name: 'County'
        label: 'County'
        type: 'String:3'
        required: true
        in_sets: ['Counties']
    exchange:
      - name: 'County'
        type: 'String:3'
        adif: 'STX_STRING'
        fixed: true
        source_param: 'County'
        is_sent: true
        in_sets: ['Counties']
      - name: 'Location'
        type: 'String:16'
        adif: 'SRX_STRING'
        is_sent: false
        in_sets:
          - Counties
          - States
          - 'Canadian Provinces'
        regex: '^\S+$'
        valid_values_or_regex: true
    qso_columns:
      - 'Location'
      - 'Mult'
      - 'Pts'
      - 'Op'
    qso_column_fields:
      Freq: 'FREQ'
      Mode: 'MODE'
      Call: 'CALL'
      Op: 'OPERATOR'
      County: 'STX_STRING'
      Location: 'SRX_STRING'
    metadata:
      source: 'https://www.w3vpr.org/sites/default/files/mdcqsoparty/Documents/Maryland-DC_QSO_Party_Rules_2020-03-04.pdf'
      notes: 'The received exchange is an MDC jurisdiction, US state, Canadian province/territory, or country.'

  - id: 'MDC-QSO-PARTY'
    extends: 'MDC-QSO-PARTY (In State)'
    display_name: 'Maryland-DC QSO Party'
    scoring:
      multipliers:
        - name: 'County'
          field: 'SRX_STRING'
          key:
            - 'SRX_STRING'
            - 'STX_STRING'
          in_sets: ['Counties']
    log_params:
      - name: 'Location'
        label: 'State, Province, or Country'
        type: 'String:16'
        required: true
    exchange:
      - name: 'Location'
        type: 'String:16'
        adif: 'STX_STRING'
        fixed: true
        source_param: 'Location'
        is_sent: true
      - name: 'County'
        type: 'String:3'
        adif: 'SRX_STRING'
        is_sent: false
        in_sets: ['Counties']
    qso_columns:
      - 'County'
      - 'Mult'
      - 'Pts'
      - 'Op'
    qso_column_fields:
      Freq: 'FREQ'
      Mode: 'MODE'
      Call: 'CALL'
      Op: 'OPERATOR'
      Location: 'STX_STRING'
      County: 'SRX_STRING'
    metadata:
      source: 'https://www.w3vpr.org/sites/default/files/mdcqsoparty/Documents/Maryland-DC_QSO_Party_Rules_2020-03-04.pdf'
      notes: 'Outside-MDC stations may score only contacts with the 25 Maryland/DC jurisdictions.'
