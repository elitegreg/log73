contests:
  - id: 'ARRL-160'
    display_name: 'ARRL 160-Meter Contest'
    allowed_bands: [160]
    allowed_modes: ['CW']
    define:
      - name: 'ARRL Sections'
        values_from_file: arrl_sections.dat
      - name: 'RAC Sections'
        values_from_file: rac_sections.dat
      - name: 'ARRL 160 W/VE DXCC'
        values: ['1', '9', '20', '43', '103', '110', '123', '166', '174', '182', '197', '202', '285', '291', '297']
    scoring:
      qso_points:
        rules:
          - when_all:
              - field: 'DXCC'
                in_sets: ['ARRL 160 W/VE DXCC']
              - field: 'MY_DXCC'
                in_sets: ['ARRL 160 W/VE DXCC']
            points: 2
          - when:
              field: 'DXCC'
              in_sets: ['ARRL 160 W/VE DXCC']
            points: 5
          - when:
              field: 'MY_DXCC'
              in_sets: ['ARRL 160 W/VE DXCC']
            points: 5
          - points: 0
      dupe_key: ['CALL']
      multipliers:
        - name: 'ARRL/RAC Section'
          field: 'ARRL_SECT'
          key: ['ARRL_SECT']
          in_sets: ['ARRL Sections', 'RAC Sections']
        - name: 'DXCC Entity'
          field: 'DXCC'
          key: ['DXCC']
          when:
            field: 'MY_DXCC'
            in_sets: ['ARRL 160 W/VE DXCC']
          exclude_values: ['1', '9', '20', '43', '103', '110', '123', '166', '174', '182', '197', '202', '285', '291', '297']
    log_params:
      - name: 'Section'
        label: 'ARRL/RAC Section'
        type: 'String:3'
        required: false
        in_sets: ['ARRL Sections', 'RAC Sections']
        help_text: 'Required for W/VE stations; DX stations send only RST.'
    exchange:
      - name: 'RST(s)'
        type: 'RST'
        adif: 'RST_SENT'
        default: 599
        is_sent: true
      - name: 'Section(s)'
        type: 'String:3'
        adif: 'MY_ARRL_SECT'
        fixed: true
        source_param: 'Section'
        in_sets: ['ARRL Sections', 'RAC Sections']
        only_when:
          field: 'MY_DXCC'
          in_sets: ['ARRL 160 W/VE DXCC']
        is_sent: true
      - name: 'RST(r)'
        type: 'RST'
        adif: 'RST_RCVD'
        default: 599
        is_sent: false
      - name: 'Section'
        type: 'String:3'
        adif: 'ARRL_SECT'
        in_sets: ['ARRL Sections', 'RAC Sections']
        only_when:
          field: 'DXCC'
          in_sets: ['ARRL 160 W/VE DXCC']
        is_sent: false
    qso_columns: ['RST(r)', 'Section', 'Mult', 'Pts', 'Op']
    qso_column_fields:
      Freq: 'FREQ'
      Mode: 'MODE'
      Call: 'CALL'
      Op: 'OPERATOR'
      'RST(s)': 'RST_SENT'
      'Section(s)': 'MY_ARRL_SECT'
      'RST(r)': 'RST_RCVD'
      Section: 'ARRL_SECT'
    cabrillo:
      contest_id: 'ARRL-160'
      fixed_fields:
        - name: 'CATEGORY-BAND'
          value: '160M'
        - name: 'CATEGORY-MODE'
          value: 'CW'
      log_fields:
        - name: 'CATEGORY-OPERATOR'
          label: 'Category Operator'
          type: 'String:24'
          widget: 'select'
          default: 'SINGLE-OP'
          valid_values: ['SINGLE-OP', 'SINGLE-OP-UNLIMITED', 'MULTI-OP', 'CHECKLOG']
        - name: 'CATEGORY-ASSISTED'
          label: 'Category Assisted'
          type: 'String:16'
          widget: 'select'
          required: false
          valid_values: ['ASSISTED', 'NON-ASSISTED']
        - name: 'CATEGORY-POWER'
          label: 'Category Power'
          type: 'String:16'
          widget: 'select'
          default: 'LOW'
          valid_values: ['QRP', 'LOW', 'HIGH']
        - name: 'CATEGORY-TRANSMITTER'
          label: 'Category Transmitter'
          type: 'String:16'
          widget: 'select'
          default: 'ONE'
          valid_values: ['ONE']
        - name: 'CATEGORY-OVERLAY'
          label: 'Category Overlay'
          type: 'String:24'
          widget: 'select'
          required: false
          valid_values: ['LIMITED-ANTENNAS']
      export_fields:
        - name: 'CLUB'
          label: 'Club'
          type: 'String:75'
          required: false
          preserve_case: true
        - name: 'EMAIL'
          label: 'Email'
          type: 'String:75'
          required: false
          regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          preserve_case: true
        - name: 'LOCATION'
          label: 'Location'
          type: 'String:32'
          required: false
          help_text: 'ARRL/RAC section for W/VE stations; DX for all others.'
        - name: 'NAME'
          label: 'Name'
          type: 'String:75'
          required: false
          preserve_case: true
        - name: 'ADDRESS'
          label: 'Address'
          type: 'String:45'
          widget: 'textarea'
          max_lines: 6
          required: false
          preserve_case: true
        - name: 'SOAPBOX'
          label: 'Soapbox'
          type: 'String:75'
          widget: 'textarea'
          required: false
          preserve_case: true
    metadata:
      source: 'https://contests.arrl.org/ContestRules/160M-Rules.pdf'
      notes: 'CW only on 160 meters. W/VE stations work all stations; DX stations may work W/VE stations only. The logger scores ineligible DX-to-DX contacts as zero; operating and category restrictions remain operator-enforced.'
