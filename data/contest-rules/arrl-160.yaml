schema: 2
contests:
  ARRL-160:
    name: ARRL 160-Meter Contest
    bands:
      - 160M
    value_sets:
      ARRL Sections:
        use: arrl-sections
      RAC Sections:
        use: rac-sections
      ARRL 160 W/VE DXCC:
        values_from_file: arrl-160-w-ve-dxcc.dat
    setup_fields:
      - id: param-section
        key: Section
        label: ARRL/RAC Section
        type: String:3
        required: false
        in_sets: [ARRL Sections, RAC Sections]
        help_text: Required for W/VE stations; DX stations send only RST.
      - id: header-category-operator
        preset: category-operator
        type: String:24
        default: SINGLE-OP
        valid_values: [SINGLE-OP, SINGLE-OP-UNLIMITED, MULTI-OP, CHECKLOG]
      - id: header-category-assisted
        preset: category-assisted
        required: false
        valid_values: [ASSISTED, NON-ASSISTED]
      - id: header-category-power
        preset: category-power
        default: LOW
        valid_values: [QRP, LOW, HIGH]
      - id: header-category-transmitter
        preset: category-transmitter
        default: ONE
        valid_values: [ONE]
      - id: header-category-overlay
        preset: category-overlay
        required: false
        valid_values: [LIMITED-ANTENNAS]
    exchange:
      - id: rst-sent
        preset: rst-sent
      - id: section-sent
        label: Section(s)
        type: String:3
        adif: MY_ARRL_SECT
        direction: sent
        fixed: true
        in_sets: [ARRL Sections, RAC Sections]
        source: Section
        only_when: {field: MY_DXCC, in_sets: [ARRL 160 W/VE DXCC]}
      - id: rst-received
        preset: rst-received
      - id: section-received
        label: Section
        type: String:3
        adif: ARRL_SECT
        direction: received
        in_sets: [ARRL Sections, RAC Sections]
        only_when: {field: DXCC, in_sets: [ARRL 160 W/VE DXCC]}
    scoring:
      qso_points:
        rules: [{id: qso-rule-1, when_all: [{field: DXCC, in_sets: [ARRL 160 W/VE DXCC]}, {field: MY_DXCC, in_sets: [ARRL 160 W/VE DXCC]}], points: 2}, {id: qso-rule-2, when: {field: DXCC, in_sets: [ARRL 160 W/VE DXCC]}, points: 5}, {id: qso-rule-3, when: {field: MY_DXCC, in_sets: [ARRL 160 W/VE DXCC]}, points: 5}, {id: qso-rule-4, points: 0}]
      dupe_key:
        - CALL
      multipliers:
        - {id: mult-arrl-rac-section, name: ARRL/RAC Section, field: ARRL_SECT, key: [ARRL_SECT], in_sets: [ARRL Sections, RAC Sections]}
        - {id: mult-dxcc-entity, name: DXCC Entity, field: DXCC, key: [DXCC], when: {field: MY_DXCC, in_sets: [ARRL 160 W/VE DXCC]}, exclude_values: ['1', '9', '20', '43', '103', '110', '123', '166', '174', '182', '197', '202', '285', '291', '297']}
    cabrillo:
      fixed_headers:
        - {id: fixed-category-band, name: CATEGORY-BAND, value: 160M}
        - {id: fixed-category-mode, name: CATEGORY-MODE, value: CW}
      export_fields:
        - {id: export-club, preset: export-club-optional}
        - {id: export-email, preset: export-email-optional}
        - {id: export-location, key: LOCATION, label: Location, type: String:32, required: false, help_text: ARRL/RAC section for W/VE stations; DX for all others.}
        - {id: export-name, preset: export-name-optional}
        - {id: export-address, preset: export-address-optional}
        - {id: export-soapbox, preset: export-soapbox-optional}
    metadata:
      source: https://contests.arrl.org/ContestRules/160M-Rules.pdf
      notes: >-
        CW only on 160 meters. W/VE stations work all stations; DX stations may work W/VE stations
        only. The logger scores ineligible DX-to-DX contacts as zero; operating and category
        restrictions remain operator-enforced.
    profiles:
      - cw-mode
