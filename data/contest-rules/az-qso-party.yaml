schema: 2
contests:
  AZ-QSO-PARTY (In State):
    name: Arizona QSO Party (In State)
    profiles: [hf-bands]
    modes: [CW, PHONE]
    value_sets:
      Arizona Counties: {values_from_file: arizona-counties.dat}
      States: {use: us-states, exclude: [AZ]}
      Canadian Provinces: {use: canadian-provinces}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: Arizona County, type: String:3, required: true, in_sets: [Arizona Counties]}
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, MULTI-OP]}
      - {id: header-category-power, preset: category-power, default: LOW, valid_values: [QRP, LOW, HIGH]}
      - {id: header-category-mode, preset: category-mode, default: MIXED, valid_values: [CW, PHONE, MIXED]}
      - {id: header-category-station, preset: category-station, default: FIXED, valid_values: [FIXED, MOBILE, EXPEDITION]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: county-sent, label: County(s), type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [Arizona Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: exchange-received, label: Exchange, type: String:5, adif: SRX_STRING, direction: received, in_sets: [Arizona Counties, States, Canadian Provinces, DX]}
    scoring:
      qso_points:
        rules: [{id: qso-cw, when: {field: MODE_CLASS, values: [CW]}, points: 2}, {id: qso-phone, points: 1}]
      dupe_key: [CALL, BAND, MODE, STX_STRING, SRX_STRING]
      multipliers:
        - {id: mult-az-cw, name: Arizona CW, field: SRX_STRING, fixed_key: AZ, when: {field: MODE_CLASS, values: [CW]}, in_sets: [Arizona Counties]}
        - {id: mult-az-phone, name: Arizona Phone, field: SRX_STRING, fixed_key: AZ, when: {field: MODE_CLASS, values: [PHONE]}, in_sets: [Arizona Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [States]}
        - {id: mult-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [Canadian Provinces]}
        - {id: mult-dxcc, name: DXCC Entity, field: DXCC, key: [DXCC, MODE_CLASS], exclude_values: ['1', '291']}
      bonus_points:
        - {id: bonus-k7a, name: K7A, field: CALL, key: [CALL], values: {K7A: 100}}
    metadata:
      source: https://www.azqp.org/rules
      notes: Arizona multipliers repeat by mode; the K7A bonus applies once.
  AZ-QSO-PARTY:
    name: Arizona QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: 'State, Province, or DX', type: String:5, required: true, in_sets: [States, Canadian Provinces, DX], before: header-category-operator}
    exchange:
      - {id: county-sent, remove: true}
      - {id: location-sent, label: Location, type: String:5, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [States, Canadian Provinces, DX], after: rst-sent}
      - {id: exchange-received, remove: true}
      - {id: county-received, label: Arizona County, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Arizona Counties], after: rst-received}
    scoring:
      multipliers:
        - {id: mult-az-cw, remove: true}
        - {id: mult-az-phone, remove: true}
        - {id: mult-state, remove: true}
        - {id: mult-province, remove: true}
        - {id: mult-dxcc, remove: true}
        - {id: mult-az-county, name: Arizona County, field: SRX_STRING, key: [SRX_STRING, BAND, MODE_CLASS]}
    metadata:
      notes: Outside-Arizona stations score each Arizona county once per band and mode.
    extends: AZ-QSO-PARTY (In State)
