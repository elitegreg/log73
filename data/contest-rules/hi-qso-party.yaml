schema: 2
contests:
  HI-QSO-PARTY (In State):
    name: Hawaii QSO Party (In State)
    modes:
      - CW
      - SSB
      - DATA
      - RTTY
    value_sets:
      DX:
        use: dx
      Hawaii Districts:
        values_from_file: hawaii-districts.dat
      States:
        use: us-states
        exclude: [HI]
      Washington DC:
        use: district-of-columbia
      Canadian Provinces:
        use: canadian-provinces
    setup_fields:
      - id: param-district
        key: District
        label: Hawaii District
        type: String:3
        required: true
        in_sets: [Hawaii Districts]
      - id: header-category-mode
        preset: category-mode
        default: MIXED
        valid_values: [CW, SSB, MIXED]
      - id: header-category-operator
        preset: category-operator
        default: SINGLE-OP
        valid_values: [SINGLE-OP, MULTI-OP, CHECKLOG]
      - id: header-category-power
        preset: category-power
        default: LOW
        valid_values: [HIGH, LOW, QRP]
      - id: header-category-transmitter
        preset: category-transmitter
        default: ONE
        valid_values: [ONE, UNLIMITED]
    exchange:
      - id: rst-sent
        preset: rst-sent
      - id: district-sent
        label: District
        type: String:3
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [Hawaii Districts]
        source: District
      - id: rst-received
        preset: rst-received
      - id: exchange-received
        label: Exchange
        type: String:3
        adif: SRX_STRING
        direction: received
        in_sets:
          [Hawaii Districts, States, Washington DC, Canadian Provinces, DX]
    scoring:
      qso_points:
        rules:
          [
            { id: qso-rule-1, when: { field: MODE, values: [SSB] }, points: 2 },
            { id: qso-rule-2, points: 3 },
          ]
      dupe_key:
        - CALL
        - BAND
        - MODE
        - STX_STRING
        - SRX_STRING
      multipliers:
        - {
            id: mult-hawaii-district,
            name: Hawaii District,
            field: SRX_STRING,
            key: [SRX_STRING],
            in_sets: [Hawaii Districts],
          }
        - {
            id: mult-state-province,
            name: State/Province,
            field: SRX_STRING,
            key: [SRX_STRING],
            in_sets: [States, Washington DC, Canadian Provinces],
          }
        - {
            id: mult-dxcc-country,
            name: DXCC Country,
            field: DXCC,
            key: [DXCC],
            exclude_values: ['1', '6', '110', '291'],
          }
    cabrillo:
      fixed_headers:
        - { id: fixed-category-band, name: CATEGORY-BAND, value: ALL }
      export_fields:
        - { id: export-club, preset: export-club-optional }
        - {
            id: export-email,
            key: EMAIL,
            label: Email,
            type: String:75,
            regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$',
            preserve_case: true,
          }
        - {
            id: export-location,
            key: LOCATION,
            label: Location,
            type: String:32,
            help_text: 'Hawaii district, state, province, or country.',
          }
        - {
            id: export-name,
            key: NAME,
            label: Name,
            type: String:75,
            preserve_case: true,
          }
        - {
            id: export-address,
            key: ADDRESS,
            label: Address,
            type: String:45,
            widget: textarea,
            max_lines: 6,
            preserve_case: true,
          }
        - { id: export-soapbox, preset: export-soapbox-optional }
    metadata:
      source: https://www.hawaiiqsoparty.org/rules-page/
      notes: Digital modes and grid-square exchanges are intentionally not supported.
    profiles:
      - hf-bands
  HI-QSO-PARTY:
    name: Hawaii QSO Party
    setup_fields:
      - id: param-district
        remove: true
      - id: param-location
        key: Location
        label: State, Province, or DX
        type: String:2
        required: true
        in_sets: [States, Washington DC, Canadian Provinces, DX]
        before: header-category-mode
      - id: header-category-mode
        after: param-location
    exchange:
      - id: district-sent
        remove: true
      - id: exchange-received
        remove: true
      - id: location-sent
        label: Location
        type: String:2
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [States, Washington DC, Canadian Provinces, DX]
        source: Location
        after: rst-sent
      - id: rst-received
        after: location-sent
      - id: district-received
        label: District
        type: String:3
        adif: SRX_STRING
        direction: received
        in_sets: [Hawaii Districts]
        after: rst-received
    scoring:
      multipliers:
        - { id: mult-state-province, remove: true }
        - { id: mult-dxcc-country, remove: true }
        - { key: [SRX_STRING, BAND], id: mult-hawaii-district }
    metadata:
      notes: >-
        Outside-Hawaii stations may score only Hawaii contacts; digital modes and grid-square
        exchanges are intentionally not supported.
    extends: HI-QSO-PARTY (In State)
