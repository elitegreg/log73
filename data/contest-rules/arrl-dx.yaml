schema: 2
contests:
  ARRL-DX-CW:
    name: ARRL International DX Contest (CW)
    value_sets:
      ARRL DX W/VE DXCC:
        values: ['1', '291']
      ARRL DX States:
        use: us-states
        exclude: [AK, HI]
      District of Columbia:
        use: district-of-columbia
      Canadian Provinces and Territories:
        use: canadian-provinces
      Labrador:
        values: [LB]
    setup_fields:
      - id: param-location
        key: Location
        label: State or Province
        type: String:2
        required: true
        in_sets: [ARRL DX States, District of Columbia, Canadian Provinces and Territories, Labrador]
      - id: header-category-operator
        preset: category-operator
        type: String:24
        default: SINGLE-OP
        valid_values: [SINGLE-OP, SINGLE-OP-UNLIMITED, MULTI-OP, CHECKLOG]
      - id: header-category-assisted
        preset: category-assisted
        default: NON-ASSISTED
        valid_values: [ASSISTED, NON-ASSISTED]
      - id: header-category-band
        preset: category-band
        default: ALL
        valid_values: [ALL, 160M, 80M, 40M, 20M, 15M, 10M]
      - id: header-category-power
        preset: category-power
        default: LOW
        valid_values: [QRP, LOW, HIGH]
      - id: header-category-transmitter
        preset: category-transmitter
        default: ONE
        valid_values: [ONE, TWO, UNLIMITED]
      - id: header-category-overlay
        preset: category-overlay
        required: false
        valid_values: [LIMITED-ANTENNAS]
    exchange:
      - id: rst-sent
        preset: rst-sent
      - id: location-sent
        label: Location(s)
        type: String:2
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [ARRL DX States, District of Columbia, Canadian Provinces and Territories, Labrador]
        source: Location
      - id: rst-received
        preset: rst-received
      - id: power-received
        label: Power
        type: String:4
        adif: SRX_STRING
        direction: received
        regex: ^\\S{1,4}$
    scoring:
      qso_points:
        category_band_param: CATEGORY-BAND
        rules: [{id: qso-rule-1, when: {field: DXCC, exclude_in_sets: [ARRL DX W/VE DXCC]}, points: 3}, {id: qso-rule-2, points: 0}]
      dupe_key:
        - CALL
        - BAND
      multipliers:
        - {id: mult-dxcc-entity, name: DXCC Entity, field: DXCC, key: [DXCC, BAND], exclude_values: ['1', '291']}
    cabrillo:
      fixed_headers:
        - {id: fixed-category-mode, name: CATEGORY-MODE, value: CW}
      export_fields:
        - {id: export-location, key: LOCATION, label: Location, type: String:32, required: false, help_text: State or province for W/VE stations; DX for all others.}
        - {id: export-club, preset: export-club-optional}
        - {id: export-email, key: EMAIL, label: Email, type: String:75, required: false, regex: '^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$', preserve_case: true}
        - {id: export-name, preset: export-name-optional}
        - {id: export-address, preset: export-address-optional}
        - {id: export-soapbox, preset: export-soapbox-optional}
    metadata:
      source: https://contests.arrl.org/ContestRules/DX-Rules.pdf
      notes: >-
        W/VE stations work DX stations only. DXCC entities count once per band, excluding USA and
        Canada. Category combinations, band-change limits, and other operating restrictions remain
        operator-enforced.
    profiles:
      - hf-bands
      - cw-mode
  ARRL-DX-CW (DX):
    name: ARRL International DX Contest (CW, DX)
    setup_fields:
      - id: param-location
        remove: true
      - id: param-power
        key: Power
        label: Power
        type: String:4
        required: true
        regex: ^\\S{1,4}$
        help_text: Transmit power as a number or abbreviation.
        before: header-category-operator
      - id: header-category-operator
        after: param-power
    exchange:
      - id: location-sent
        remove: true
      - id: power-received
        remove: true
      - id: power-sent
        label: Power(s)
        type: String:4
        adif: STX_STRING
        direction: sent
        fixed: true
        regex: ^\\S{1,4}$
        source: Power
        after: rst-sent
      - id: rst-received
        after: power-sent
      - id: location-received
        label: Location
        type: String:2
        adif: SRX_STRING
        direction: received
        in_sets: [ARRL DX States, District of Columbia, Canadian Provinces and Territories, Labrador]
        after: rst-received
    scoring:
      qso_points:
        rules: [{when: {exclude_in_sets: null, in_sets: [ARRL DX W/VE DXCC]}, id: qso-rule-1}]
      multipliers:
        - {id: mult-dxcc-entity, remove: true}
        - {id: mult-state-or-province, name: State or Province, field: SRX_STRING, key: [SRX_STRING, BAND], in_sets: [ARRL DX States, District of Columbia, Canadian Provinces and Territories, Labrador]}
    metadata:
      notes: >-
        DX stations work W/VE stations only. States, DC, Canadian provinces and territories, and
        Labrador count once per band. Category combinations, band-change limits, and other operating
        restrictions remain operator-enforced.
    extends: ARRL-DX-CW
  ARRL-DX-SSB:
    name: ARRL International DX Contest (SSB)
    modes:
      - SSB
    cabrillo:
      fixed_headers:
        - {value: SSB, id: fixed-category-mode}
    extends: ARRL-DX-CW
  ARRL-DX-SSB (DX):
    name: ARRL International DX Contest (SSB, DX)
    modes:
      - SSB
    cabrillo:
      fixed_headers:
        - {value: SSB, id: fixed-category-mode}
    extends: ARRL-DX-CW (DX)
