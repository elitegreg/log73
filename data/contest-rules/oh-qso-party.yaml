schema: 2
contests:
  OH-QSO-PARTY (In State):
    name: Ohio QSO Party (In State)
    modes:
      - CW
      - SSB
    value_sets:
      DX:
        use: dx
      Ohio Counties:
        values_from_file: ohio-counties.dat
      States:
        use: us-states
        exclude: [OH]
      Canadian Provinces:
        use: canadian-provinces
    setup_fields:
      - id: param-county
        key: County
        label: Ohio County
        type: String:4
        required: true
        in_sets: [Ohio Counties]
    exchange:
      - id: rst-sent
        preset: rst-sent
      - id: county-sent
        label: County
        type: String:4
        adif: STX_STRING
        direction: sent
        in_sets: [Ohio Counties]
        source: County
      - id: rst-received
        preset: rst-received
      - id: exchange-received
        label: Exchange
        type: String:4
        adif: SRX_STRING
        direction: received
        in_sets: [Ohio Counties, States, Canadian Provinces, DX]
    scoring:
      qso_points:
        rules: [{id: qso-rule-1, when: {field: MODE, values: [SSB]}, points: 1}, {id: qso-rule-2, points: 2}]
      dupe_key:
        - CALL
        - BAND
        - MODE
        - STX_STRING
        - SRX_STRING
      multipliers:
        - {id: mult-ohio-county, name: Ohio County, field: SRX_STRING, key: [SRX_STRING, MODE], in_sets: [Ohio Counties]}
        - {id: mult-state-province-dx, name: State/Province/DX, field: SRX_STRING, key: [SRX_STRING, MODE], in_sets: [States, Canadian Provinces, DX]}
    cabrillo:
      fixed_headers: []
      export_fields: []
    metadata:
      source: https://www.ohqp.org/index.php/rules/
      notes: >-
        CW and SSB only. County remains editable so Ohio mobile and rover stations can record each
        activated county.
    profiles:
      - hf-bands
  OH-QSO-PARTY:
    name: Ohio QSO Party
    setup_fields:
      - id: param-county
        remove: true
      - id: param-location
        key: Location
        label: State, Province, or DX
        type: String:2
        required: true
        in_sets: [States, Canadian Provinces, DX]
    exchange:
      - id: county-sent
        remove: true
      - id: exchange-received
        remove: true
      - id: location-sent
        label: Location
        type: String:2
        adif: STX_STRING
        direction: sent
        in_sets: [States, Canadian Provinces, DX]
        source: Location
        after: rst-sent
      - id: rst-received
        after: location-sent
      - id: county-received
        label: County
        type: String:4
        adif: SRX_STRING
        direction: received
        in_sets: [Ohio Counties]
        after: rst-received
    scoring:
      multipliers:
        - {id: mult-state-province-dx, remove: true}
    metadata:
      notes: >-
        Outside-Ohio stations may score only Ohio county contacts. Location remains editable for
        mobile stations.
    extends: OH-QSO-PARTY (In State)
