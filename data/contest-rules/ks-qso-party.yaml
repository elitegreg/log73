schema: 2
contests:
  KS-QSO-PARTY (In State):
    name: Kansas QSO Party (In State)
    bands:
      - 80M
      - 40M
      - 20M
      - 15M
      - 10M
      - 6M
    modes:
      - CW
      - SSB
      - RTTY
    value_sets:
      DX:
        use: dx
      Kansas Counties:
        values_from_file: kansas-counties.dat
      States:
        use: us-states
        exclude: [KS]
      Canadian Provinces:
        use: canadian-provinces
    setup_fields:
      - id: param-county
        key: County
        label: Kansas County
        type: String:3
        required: true
        in_sets: [Kansas Counties]
      - id: header-category-mode
        preset: category-mode
        valid_values: [CW, SSB, MIXED]
      - id: header-category-operator
        preset: category-operator
        valid_values: [SINGLE-OP, MULTI-OP, CHECKLOG]
      - id: header-category-power
        preset: category-power
        valid_values: [HIGH, LOW, QRP]
      - id: header-category-station
        preset: category-station
        valid_values: [FIXED, MOBILE, PORTABLE]
      - id: header-category-transmitter
        preset: category-transmitter
        valid_values: [ONE, UNLIMITED]
    exchange:
      - id: rst-sent
        preset: rst-sent
      - id: county-sent
        label: County
        type: String:3
        adif: STX_STRING
        direction: sent
        in_sets: [Kansas Counties]
        source: County
      - id: rst-received
        preset: rst-received
      - id: exchange-received
        label: Exchange
        type: String:3
        adif: SRX_STRING
        direction: received
        in_sets: [Kansas Counties, States, Canadian Provinces, DX]
    scoring:
      qso_points:
        rules:
          [
            { id: qso-rule-1, when: { field: MODE, values: [SSB] }, points: 2 },
            { id: qso-rule-2, points: 3 },
          ]
      dupe_key:
        - CALL
        - BAND
        - MODE
        - STX_STRING
        - SRX_STRING
      multipliers:
        - {
            id: mult-kansas,
            name: Kansas,
            field: SRX_STRING,
            key: [SRX_STRING],
            in_sets: [Kansas Counties],
            fixed_key: KS,
          }
        - {
            id: mult-state-province-dx,
            name: State/Province/DX,
            field: SRX_STRING,
            key: [SRX_STRING],
            in_sets: [States, Canadian Provinces, DX],
          }
      bonus_points:
        - {
            id: bonus-bonus-station,
            name: Bonus Station,
            field: CALL,
            key: [CALL],
            values: { KS0KS: 100 },
          }
    cabrillo:
      fixed_headers:
        - { id: fixed-category-band, name: CATEGORY-BAND, value: ALL }
      export_fields:
        - {
            id: export-name,
            key: NAME,
            label: Name,
            type: String:75,
            preserve_case: true,
          }
        - {
            id: export-address,
            key: ADDRESS,
            label: Address,
            type: String:45,
            widget: textarea,
            max_lines: 6,
            preserve_case: true,
          }
        - {
            id: export-location,
            key: LOCATION,
            label: Location,
            type: String:32,
            help_text: 'Kansas county, state, province, or DX.',
          }
        - {
            id: export-email,
            key: EMAIL,
            label: Email,
            type: String:75,
            regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$',
            preserve_case: true,
          }
        - { id: export-club, preset: export-club-optional }
        - { id: export-soapbox, preset: export-soapbox-optional }
    metadata:
      source: https://www.ksqsoparty.org/rules/KSQPRules2026.pdf?1=
      notes: >-
        CW and SSB only. Kansas stations may change their sent county while mobile or rover; a
        county change makes them a new station for QSO and multiplier credit.
  KS-QSO-PARTY:
    name: Kansas QSO Party
    setup_fields:
      - id: param-county
        remove: true
      - id: param-location
        key: Location
        label: State, Province, or DX
        type: String:2
        required: true
        in_sets: [States, Canadian Provinces, DX]
        before: header-category-mode
      - id: header-category-mode
        after: param-location
    exchange:
      - id: county-sent
        remove: true
      - id: exchange-received
        remove: true
      - id: location-sent
        label: Location
        type: String:2
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [States, Canadian Provinces, DX]
        source: Location
        after: rst-sent
      - id: rst-received
        after: location-sent
      - id: county-received
        label: County
        type: String:3
        adif: SRX_STRING
        direction: received
        in_sets: [Kansas Counties]
        after: rst-received
    scoring:
      multipliers:
        - { id: mult-kansas, remove: true }
        - { id: mult-state-province-dx, remove: true }
        - {
            id: mult-kansas-county,
            name: Kansas County,
            field: SRX_STRING,
            key: [SRX_STRING],
            in_sets: [Kansas Counties],
          }
    metadata:
      notes: Outside-Kansas stations score Kansas county multipliers only. CW and SSB only.
    extends: KS-QSO-PARTY (In State)
