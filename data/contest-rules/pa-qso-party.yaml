schema: 2
contests:
  PA-QSO-PARTY (In State):
    name: Pennsylvania QSO Party (In State)
    profiles: [all-contest-bands]
    modes: [CW, PHONE]
    value_sets:
      Pennsylvania Counties: {values_from_file: pennsylvania-counties.dat}
      ARRL/RAC Sections: {values_from_file: pa-arrl-rac-sections.dat}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: Pennsylvania County, type: String:3, required: true, in_sets: [Pennsylvania Counties]}
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, MULTI-OP]}
      - {id: header-category-power, preset: category-power, default: LOW, valid_values: [QRP, LOW, HIGH]}
      - {id: header-category-mode, preset: category-mode, default: MIXED, valid_values: [CW, PHONE, MIXED]}
      - {id: header-category-station, preset: category-station, default: FIXED, valid_values: [FIXED, PORTABLE, MOBILE, ROVER, COUNTY-LINE]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: serial-sent, label: Serial(s), type: Serial:6, adif: STX, direction: sent, serial_scope: band}
      - {id: county-sent, label: County(s), type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [Pennsylvania Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: serial-received, label: Serial, type: Serial:6, adif: SRX, direction: received}
      - {id: exchange-received, label: Exchange, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Pennsylvania Counties, ARRL/RAC Sections, DX]}
    scoring:
      qso_points:
        rules: [{id: qso-cw, when: {field: MODE_CLASS, values: [CW]}, points: 2}, {id: qso-phone, points: 1}]
      dupe_key: [CALL, BAND, MODE, STX_STRING, SRX_STRING]
      multipliers:
        - {id: mult-pa-county, name: Pennsylvania County, field: SRX_STRING, key: [SRX_STRING], in_sets: [Pennsylvania Counties]}
        - {id: mult-section, name: ARRL/RAC Section, field: SRX_STRING, key: [SRX_STRING], in_sets: [ARRL/RAC Sections]}
        - {id: mult-eastern-pa, name: ARRL/RAC Section, field: SRX_STRING, fixed_key: EPA, when: {field: SRX_STRING}}
        - {id: mult-western-pa, name: ARRL/RAC Section, field: SRX_STRING, fixed_key: WPA, when: {field: SRX_STRING}}
        - {id: mult-dx, name: DX, field: SRX_STRING, fixed_key: DX, in_sets: [DX]}
      param_multipliers:
        - {id: qrp-factor, param: CATEGORY-POWER, values: {QRP: 2}}
      qso_count_bonus_points:
        - {id: mobile-rover-county, name: Mobile/Rover County, field: STX_STRING, param: CATEGORY-STATION, values: [MOBILE, ROVER], thresholds: {'10': 500}}
      bonus_points:
        - {id: bonus-station, name: Bonus Station, field: CALL, key: [CALL, BAND, MODE, STX_STRING, SRX_STRING], values: {N3XF: 200}}
    metadata:
      source: https://paqso.org/files/PAQSO_Rules.pdf
      notes: The N3XF bonus-station callsign is from the published 2025 rules and must be refreshed when the sponsor announces a new one. Mobile/rover county bonuses require ten valid QSOs; rover distance remains operator-enforced.
  PA-QSO-PARTY:
    name: Pennsylvania QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: ARRL/RAC Section or DX, type: String:3, required: true, in_sets: [ARRL/RAC Sections, DX], before: header-category-operator}
    exchange:
      - {id: county-sent, remove: true}
      - {id: location-sent, label: Location, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [ARRL/RAC Sections, DX], after: serial-sent}
      - {id: exchange-received, remove: true}
      - {id: county-received, label: Pennsylvania County, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Pennsylvania Counties], after: serial-received}
    scoring:
      multipliers:
        - {id: mult-section, remove: true}
        - {id: mult-eastern-pa, remove: true}
        - {id: mult-western-pa, remove: true}
        - {id: mult-dx, remove: true}
      qso_count_bonus_points:
        - {id: mobile-rover-county, remove: true}
    metadata:
      notes: Outside-Pennsylvania stations score the 67 Pennsylvania counties once each; they do not receive the mobile/rover county bonus.
    extends: PA-QSO-PARTY (In State)
