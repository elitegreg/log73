schema: 2
contests:
  MS-QSO-PARTY (In State):
    name: Mississippi QSO Party (In State)
    profiles: [hf-vhf-bands]
    modes: [CW, SSB, RTTY, DIGITAL]
    value_sets:
      Mississippi Counties: {values_from_file: mississippi-counties.dat}
      States: {use: us-states, exclude: [MS]}
      Canadian Provinces: {use: canadian-provinces}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: Mississippi County, type: String:3, required: true, in_sets: [Mississippi Counties]}
      - {id: header-category-station, preset: category-station, default: FIXED, valid_values: [FIXED, PORTABLE, MOBILE]}
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, UNLIMITED]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: county-sent, label: County, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [Mississippi Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: exchange-received, label: Exchange, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Mississippi Counties, States, Canadian Provinces, DX]}
    scoring:
      qso_points:
        rules: [{id: qso-phone, when: {field: MODE_CLASS, values: [PHONE]}, points: 1}, {id: qso-cw-digital, points: 2}]
      dupe_key: [CALL, BAND, MODE]
      multipliers:
        - {id: mult-county, name: Mississippi County, field: SRX_STRING, key: [SRX_STRING], in_sets: [Mississippi Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING], in_sets: [States]}
        - {id: mult-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING], in_sets: [Canadian Provinces]}
        - {id: mult-dxcc, name: DXCC Entity, field: DXCC, key: [DXCC], exclude_values: ['1', '291']}
    metadata:
      source: https://arrlmiss.org/wp-content/uploads/2025/12/2026-MS-QSO-PARTY-RULES-FINAL.pdf
      notes: FT4/FT8 contacts use ordinary digital logging; grid-specific WSJT-X scoring is intentionally not modeled.
  MS-QSO-PARTY:
    name: Mississippi QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: 'State, Province, or DX', type: String:3, required: true, in_sets: [States, Canadian Provinces, DX], before: header-category-station}
    exchange:
      - {id: county-sent, remove: true}
      - {id: location-sent, label: Location, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [States, Canadian Provinces, DX], after: rst-sent}
      - {id: exchange-received, remove: true}
      - {id: county-received, label: Mississippi County, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Mississippi Counties], after: rst-received}
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-province, remove: true}
        - {id: mult-dxcc, remove: true}
    extends: MS-QSO-PARTY (In State)
