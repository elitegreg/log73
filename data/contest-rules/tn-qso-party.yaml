schema: 2
contests:
  TN-QSO-PARTY (In State):
    name: Tennessee QSO Party (In State)
    modes:
      - CW
      - SSB
    value_sets:
      Tennessee Counties:
        values_from_file: tennessee-counties.dat
      States:
        use: us-states
        exclude: [TN]
      Canadian Provinces:
        use: canadian-provinces
    setup_fields:
      - id: param-county
        key: County
        label: Tennessee County
        type: String:4
        required: true
        in_sets: [Tennessee Counties]
      - id: header-category-mode
        preset: category-mode
        default: MIXED
        valid_values: [CW, SSB, MIXED]
      - id: header-category-operator
        preset: category-operator
        default: SINGLE-OP
        valid_values: [SINGLE-OP, MULTI-OP, CHECKLOG]
      - id: header-category-power
        preset: category-power
        default: LOW
        valid_values: [HIGH, LOW, QRP]
      - id: header-category-station
        preset: category-station
        default: FIXED
        valid_values: [FIXED, MOBILE, ROVER]
      - id: header-category-transmitter
        preset: category-transmitter
        default: ONE
        valid_values: [ONE, UNLIMITED]
    exchange:
      - id: rst-sent
        preset: rst-sent
      - id: county-sent
        label: County
        type: String:4
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [Tennessee Counties]
        source: County
      - id: rst-received
        preset: rst-received
      - id: location-received
        label: Location
        type: String:4
        adif: SRX_STRING
        direction: received
        regex: ^\S+$
        valid_values_or_regex: true
        in_sets: [Tennessee Counties, States, Canadian Provinces]
    scoring:
      qso_points:
        points: 3
      dupe_key:
        - CALL
        - BAND
        - MODE
        - STX_STRING
        - SRX_STRING
      multipliers:
        - {id: mult-tennessee-county, name: Tennessee County, field: SRX_STRING, key: [SRX_STRING, BAND], in_sets: [Tennessee Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING, BAND], in_sets: [States]}
        - {id: mult-canadian-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING, BAND], in_sets: [Canadian Provinces]}
        - {id: mult-dxcc-entity, name: DXCC Entity, field: DXCC, key: [DXCC, BAND], exclude_values: ['1', '6', '110', '291']}
      bonus_points:
        - {id: bonus-tcg-headquarters, name: TCG Headquarters, field: CALL, key: [CALL, BAND, MODE, STX_STRING], values: {K4TCG: 100}}
    cabrillo:
      fixed_headers:
        - {id: fixed-category-band, name: CATEGORY-BAND, value: ALL}
      export_fields:
        - {id: export-club, preset: export-club-optional}
        - {id: export-email, key: EMAIL, label: Email, type: String:75, regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$', preserve_case: true}
        - {id: export-location, key: LOCATION, label: Location, type: String:4, regex: ^\S+$, valid_values_or_regex: true, in_sets: [Tennessee Counties, States, Canadian Provinces], help_text: 'Tennessee county, state, province/territory, or DXCC prefix.'}
        - {id: export-name, key: NAME, label: Name, type: String:75, preserve_case: true}
        - {id: export-address, key: ADDRESS, label: Address, type: String:45, widget: textarea, max_lines: 6, preserve_case: true}
        - {id: export-soapbox, preset: export-soapbox-optional}
    metadata:
      notes: >-
        Based on the supplied 2025 rules. Digital modes, 1.25m/70cm, and the mobile/rover 10-QSO
        county multiplier and 500-point activation bonus are not supported.
    profiles:
      - hf-vhf-bands
  TN-QSO-PARTY:
    name: Tennessee QSO Party
    setup_fields:
      - id: param-county
        remove: true
      - id: param-location
        key: Location
        label: County, State, Province, or DXCC Prefix
        type: String:4
        required: true
        regex: ^\S+$
        valid_values_or_regex: true
        in_sets: [Tennessee Counties, States, Canadian Provinces]
        before: header-category-mode
      - id: header-category-mode
        after: param-location
    exchange:
      - id: county-sent
        remove: true
      - id: location-received
        remove: true
      - id: location-sent
        label: Location
        type: String:4
        adif: STX_STRING
        direction: sent
        fixed: true
        regex: ^\S+$
        valid_values_or_regex: true
        in_sets: [Tennessee Counties, States, Canadian Provinces]
        source: Location
        after: rst-sent
      - id: rst-received
        after: location-sent
      - id: county-received
        label: County
        type: String:4
        adif: SRX_STRING
        direction: received
        in_sets: [Tennessee Counties]
        after: rst-received
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-canadian-province, remove: true}
        - {id: mult-dxcc-entity, remove: true}
    metadata:
      notes: >-
        Outside-Tennessee stations score only Tennessee county contacts. Digital modes, 1.25m/70cm,
        and the mobile/rover 10-QSO county multiplier and 500-point activation bonus are not
        supported.
    extends: TN-QSO-PARTY (In State)
