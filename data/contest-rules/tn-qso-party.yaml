contests:
  - id: 'TN-QSO-PARTY (In State)'
    display_name: 'Tennessee QSO Party (In State)'
    allowed_bands: [160, 80, 40, 20, 15, 10, 6, 2]
    allowed_modes: ['CW', 'SSB']
    scoring:
      qso_points:
        points: 3
      dupe_key: ['CALL', 'BAND', 'MODE', 'STX_STRING', 'SRX_STRING']
      multipliers:
        - name: 'Tennessee County'
          field: 'SRX_STRING'
          key: ['SRX_STRING', 'BAND']
          in_sets: ['Tennessee Counties']
        - name: 'State'
          field: 'SRX_STRING'
          key: ['SRX_STRING', 'BAND']
          in_sets: ['States']
        - name: 'Canadian Province'
          field: 'SRX_STRING'
          key: ['SRX_STRING', 'BAND']
          in_sets: ['Canadian Provinces']
        - name: 'DXCC Entity'
          field: 'DXCC'
          key: ['DXCC', 'BAND']
          exclude_values: ['1', '6', '110', '291']
      bonus_points:
        - name: 'TCG Headquarters'
          field: 'CALL'
          key: ['CALL', 'BAND', 'MODE', 'STX_STRING']
          values:
            K4TCG: 100
    cabrillo:
      contest_id: 'TN-QSO-PARTY'
      fixed_fields:
        - name: 'CATEGORY-BAND'
          value: 'ALL'
      log_fields:
        - name: 'CATEGORY-MODE'
          label: 'Category Mode'
          type: 'String:16'
          widget: 'select'
          default: 'MIXED'
          valid_values: ['CW', 'SSB', 'MIXED']
        - name: 'CATEGORY-OPERATOR'
          label: 'Category Operator'
          type: 'String:16'
          widget: 'select'
          default: 'SINGLE-OP'
          valid_values: ['SINGLE-OP', 'MULTI-OP', 'CHECKLOG']
        - name: 'CATEGORY-POWER'
          label: 'Category Power'
          type: 'String:16'
          widget: 'select'
          default: 'LOW'
          valid_values: ['HIGH', 'LOW', 'QRP']
        - name: 'CATEGORY-STATION'
          label: 'Category Station'
          type: 'String:16'
          widget: 'select'
          default: 'FIXED'
          valid_values: ['FIXED', 'MOBILE', 'ROVER']
        - name: 'CATEGORY-TRANSMITTER'
          label: 'Category Transmitter'
          type: 'String:16'
          widget: 'select'
          default: 'ONE'
          valid_values: ['ONE', 'UNLIMITED']
      export_fields:
        - name: 'CLUB'
          label: 'Club'
          type: 'String:75'
          required: false
          preserve_case: true
        - name: 'EMAIL'
          label: 'Email'
          type: 'String:75'
          regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          preserve_case: true
        - name: 'LOCATION'
          label: 'Location'
          type: 'String:4'
          help_text: 'Tennessee county, state, province/territory, or DXCC prefix.'
          in_sets: ['Tennessee Counties', 'States', 'Canadian Provinces', '*']
        - name: 'NAME'
          label: 'Name'
          type: 'String:75'
          preserve_case: true
        - name: 'ADDRESS'
          label: 'Address'
          type: 'String:45'
          widget: 'textarea'
          max_lines: 6
          preserve_case: true
        - name: 'SOAPBOX'
          label: 'Soapbox'
          type: 'String:75'
          widget: 'textarea'
          required: false
          preserve_case: true
    define:
      - name: 'Tennessee Counties'
        values:
          - ANDE
          - BEDF
