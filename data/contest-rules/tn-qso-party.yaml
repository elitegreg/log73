      - name: 'States'
        values_from_file: us_states.dat
        exclude: ['TN']
      - name: 'Canadian Provinces'
        values_from_file: canadian_provices.dat
    log_params:
      - name: 'County'
        label: 'Tennessee County'
        type: 'String:4'
        required: true
        in_sets: ['Tennessee Counties']
    exchange:
      - name: 'RST(s)'
        type: 'RST'
        adif: 'RST_SENT'
        default: 599
        is_sent: true
      - name: 'County'
        type: 'String:4'
        adif: 'STX_STRING'
        fixed: true
        source_param: 'County'
        is_sent: true
        in_sets: ['Tennessee Counties']
      - name: 'RST(r)'
        type: 'RST'
        adif: 'RST_RCVD'
        default: 599
        is_sent: false
      - name: 'Location'
        type: 'String:4'
        adif: 'SRX_STRING'
        is_sent: false
        in_sets: ['Tennessee Counties', 'States', 'Canadian Provinces', '*']
    qso_columns: ['RST(s)', 'RST(r)', 'Location', 'Mult', 'Pts', 'Op']
    qso_column_fields:
      Freq: 'FREQ'
      Mode: 'MODE'
      Call: 'CALL'
      Op: 'OPERATOR'
      'RST(s)': 'RST_SENT'
      County: 'STX_STRING'
      'RST(r)': 'RST_RCVD'
      Location: 'SRX_STRING'
    metadata:
      notes: 'Based on the supplied 2025 rules. Digital modes, 1.25m/70cm, and the mobile/rover 10-QSO county multiplier and 500-point activation bonus are not supported.'

  - id: 'TN-QSO-PARTY'
    extends: 'TN-QSO-PARTY (In State)'
    display_name: 'Tennessee QSO Party'
    scoring:
      multipliers:
        - name: 'Tennessee County'
          field: 'SRX_STRING'
          key: ['SRX_STRING', 'BAND']
          in_sets: ['Tennessee Counties']
    log_params:
      - name: 'Location'
        label: 'County, State, Province, or DXCC Prefix'
        type: 'String:4'
        required: true
        in_sets: ['Tennessee Counties', 'States', 'Canadian Provinces', '*']
    exchange:
      - name: 'RST(s)'
        type: 'RST'
        adif: 'RST_SENT'
        default: 599
        is_sent: true
      - name: 'Location'
        type: 'String:4'
        adif: 'STX_STRING'
        fixed: true
        source_param: 'Location'
        is_sent: true
        in_sets: ['Tennessee Counties', 'States', 'Canadian Provinces', '*']
      - name: 'RST(r)'
        type: 'RST'
        adif: 'RST_RCVD'
        default: 599
        is_sent: false
      - name: 'County'
        type: 'String:4'
        adif: 'SRX_STRING'
        is_sent: false
        in_sets: ['Tennessee Counties']
    qso_columns: ['RST(s)', 'RST(r)', 'County', 'Mult', 'Pts', 'Op']
    qso_column_fields:
      Freq: 'FREQ'
      Mode: 'MODE'
      Call: 'CALL'
      Op: 'OPERATOR'
      'RST(s)': 'RST_SENT'
      Location: 'STX_STRING'
      'RST(r)': 'RST_RCVD'
      County: 'SRX_STRING'
    metadata:
      notes: 'Outside-Tennessee stations score only Tennessee county contacts. Digital modes, 1.25m/70cm, and the mobile/rover 10-QSO county multiplier and 500-point activation bonus are not supported.'
