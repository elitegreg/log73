schema: 2
contests:
  OK-QSO-PARTY (In State):
    name: Oklahoma QSO Party (In State)
    bands: [80M, 40M, 20M, 15M, 10M, 6M, 2M]
    modes: [CW, PHONE, DIGITAL]
    value_sets:
      Oklahoma Counties: {values_from_file: oklahoma-counties.dat}
      States: {use: us-states, exclude: [OK]}
      Canadian Provinces: {use: canadian-provinces}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: Oklahoma County, type: String:3, required: true, in_sets: [Oklahoma Counties]}
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, MULTI-OP]}
      - {id: header-category-power, preset: category-power, default: LOW, valid_values: [HIGH, LOW, QRP]}
      - {id: header-category-station, preset: category-station, default: FIXED, valid_values: [FIXED, MOBILE, ROVER]}
      - {id: header-category-mode, preset: category-mode, default: MIXED, valid_values: [CW, PHONE, DIGITAL, MIXED]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: county-sent, label: County, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [Oklahoma Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: exchange-received, label: 'State, Province, or DX', type: String:3, adif: SRX_STRING, direction: received, in_sets: [Oklahoma Counties, States, Canadian Provinces, DX]}
    scoring:
      qso_points:
        rules: [{id: qso-phone, when: {field: MODE_CLASS, values: [PHONE]}, points: 2}, {id: qso-cw-digital, points: 3}]
      dupe_key: [CALL, BAND, MODE_CLASS, STX_STRING, SRX_STRING]
      multipliers:
        - {id: mult-county, name: Oklahoma County, field: SRX_STRING, key: [SRX_STRING], in_sets: [Oklahoma Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING], in_sets: [States]}
        - {id: mult-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING], in_sets: [Canadian Provinces]}
        - {id: mult-dxcc, name: DXCC Entity, field: DXCC, key: [DXCC], exclude_values: ['1', '6', '110', '291']}
      qso_count_bonus_points:
        - {id: mobile-county-bonus, name: Mobile County, field: STX_STRING, param: CATEGORY-STATION, values: [MOBILE, ROVER], thresholds: {'10': 500}}
    metadata:
      source: http://k5cm.com/okqp2026rules.pdf
      notes: >-
        Based on the latest available 2026 rules. FT8/FT4 is excluded. The
        fractional power categories, multi-county-line duplicate expansion, and category-specific
        mobile variants are operator-enforced; mobile county bonuses are scored after ten QSOs.
  OK-QSO-PARTY:
    name: Oklahoma QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: 'State, Province, or DX', type: String:3, required: true, in_sets: [States, Canadian Provinces, DX], before: header-category-operator}
    exchange:
      - {id: county-sent, remove: true}
      - {id: exchange-received, remove: true}
      - {id: location-sent, label: Location, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [States, Canadian Provinces, DX], after: rst-sent}
      - {id: rst-received, after: location-sent}
      - {id: county-received, label: Oklahoma County, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Oklahoma Counties], after: rst-received}
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-province, remove: true}
        - {id: mult-dxcc, remove: true}
      qso_count_bonus_points:
        - {id: mobile-county-bonus, remove: true}
    extends: OK-QSO-PARTY (In State)
