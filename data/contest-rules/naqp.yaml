schema: 2
contests:
  NAQP-CW (North America):
    name: North American QSO Party CW (North America)
    value_sets:
      US Multipliers:
        use: us-states
      District of Columbia:
        use: district-of-columbia
      Canadian Multipliers:
        use: canadian-provinces
      North American Countries:
        use: north-american-countries
      DX:
        use: dx
    setup_fields:
      - id: param-qth
        key: QTH
        label: State, Province, or NA Country
        type: String:5
        required: true
        in_sets:
          [
            US Multipliers,
            District of Columbia,
            Canadian Multipliers,
            North American Countries,
          ]
      - id: header-category-operator
        preset: category-operator
        default: SINGLE-OP
        valid_values: [SINGLE-OP, MULTI-OP, CHECKLOG]
      - id: header-category-assisted
        preset: category-assisted
        default: NON-ASSISTED
        valid_values: [NON-ASSISTED, ASSISTED]
      - id: header-category-power
        preset: category-power
        default: LOW
        valid_values: [QRP, LOW, HIGH]
      - id: header-category-transmitter
        preset: category-transmitter
        default: ONE
        valid_values: [ONE, TWO]
      - id: header-name
        key: NAME
        label: Operator Name
        type: String:20
        required: true
        regex: ^[A-Za-z]+$
        preserve_case: true
        cabrillo_header: NAME
      - id: header-location
        key: LOCATION
        label: Cabrillo Location
        type: String:32
        required: true
        help_text: 'US/Canada: state or province. All other stations: DX.'
        cabrillo_header: LOCATION
    exchange:
      - id: name-sent
        label: Name(s)
        type: String:20
        adif: MY_NAME
        direction: sent
        fixed: true
        regex: ^[A-Za-z]+$
        source: NAME
      - id: qth-sent
        label: QTH(s)
        type: String:5
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets:
          [
            US Multipliers,
            District of Columbia,
            Canadian Multipliers,
            North American Countries,
          ]
        source: QTH
      - id: name-received
        label: Name
        type: String:20
        adif: NAME
        direction: received
        regex: ^[A-Za-z]+$
      - id: qth-received
        label: QTH
        type: String:5
        adif: SRX_STRING
        direction: received
        in_sets:
          [
            US Multipliers,
            District of Columbia,
            Canadian Multipliers,
            North American Countries,
            DX,
          ]
    scoring:
      qso_points:
        points: 1
      dupe_key:
        - CALL
        - BAND
      multipliers:
        - {
            id: mult-north-american-location,
            name: North American Location,
            field: SRX_STRING,
            key: [SRX_STRING, BAND],
            in_sets:
              [
                US Multipliers,
                District of Columbia,
                Canadian Multipliers,
                North American Countries,
              ],
          }
    cabrillo:
      fixed_headers:
        - { id: fixed-category-band, name: CATEGORY-BAND, value: ALL }
        - { id: fixed-category-mode, name: CATEGORY-MODE, value: CW }
      export_fields:
        - {
            id: export-email,
            key: EMAIL,
            label: Email,
            type: String:75,
            required: false,
            regex: '^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$',
            preserve_case: true,
          }
        - { id: export-address, preset: export-address-optional }
        - {
            id: export-address-city,
            key: ADDRESS-CITY,
            label: Address City,
            type: String:45,
            required: false,
            preserve_case: true,
          }
        - {
            id: export-address-state-province,
            key: ADDRESS-STATE-PROVINCE,
            label: Address State/Province,
            type: String:45,
            required: false,
            preserve_case: true,
          }
        - {
            id: export-address-postalcode,
            key: ADDRESS-POSTALCODE,
            label: Address Postal Code,
            type: String:16,
            required: false,
            preserve_case: true,
          }
        - {
            id: export-address-country,
            key: ADDRESS-COUNTRY,
            label: Address Country,
            type: String:45,
            required: false,
            preserve_case: true,
          }
        - { id: export-soapbox, preset: export-soapbox-optional }
    metadata:
      source: https://ncjweb.com/NAQP-Rules.pdf
      notes: >-
        Single-operator off-time limits, M2 10-minute band changes, signal limits, one
        name/callsign, power-category consistency, and submission deadline remain operator-enforced.
    profiles:
      - hf-bands
      - cw-mode
  NAQP-CW (DX):
    name: North American QSO Party CW (DX)
    setup_fields:
      - id: param-qth
        remove: true
    exchange:
      - id: qth-sent
        remove: true
      - id: name-received
        after: name-sent
      - in_sets:
          [
            US Multipliers,
            District of Columbia,
            Canadian Multipliers,
            North American Countries,
          ]
        id: qth-received
    scoring:
      qso_points:
        points: null
        rules:
          [
            {
              id: qso-rule-1,
              when:
                {
                  field: SRX_STRING,
                  in_sets:
                    [
                      US Multipliers,
                      District of Columbia,
                      Canadian Multipliers,
                      North American Countries,
                    ],
                },
              points: 1,
            },
            { id: qso-rule-2, points: 0 },
          ]
    metadata:
      notes: >-
        DX entrants send only their name and score North American contacts. Single-operator off-time
        limits, M2 10-minute band changes, signal limits, one name/callsign, power-category
        consistency, and submission deadline remain operator-enforced.
    extends: NAQP-CW (North America)
  NAQP-SSB (North America):
    name: North American QSO Party SSB (North America)
    modes:
      - SSB
    cabrillo:
      fixed_headers:
        - { value: SSB, id: fixed-category-mode }
    extends: NAQP-CW (North America)
  NAQP-SSB (DX):
    name: North American QSO Party SSB (DX)
    modes:
      - SSB
    cabrillo:
      fixed_headers:
        - { value: SSB, id: fixed-category-mode }
    extends: NAQP-CW (DX)
  NAQP-RTTY (North America):
    name: North American QSO Party RTTY (North America)
    modes:
      - RTTY
    cabrillo:
      fixed_headers:
        - { value: RTTY, id: fixed-category-mode }
    extends: NAQP-CW (North America)
  NAQP-RTTY (DX):
    name: North American QSO Party RTTY (DX)
    modes:
      - RTTY
    cabrillo:
      fixed_headers:
        - { value: RTTY, id: fixed-category-mode }
    extends: NAQP-CW (DX)
