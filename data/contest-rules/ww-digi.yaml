schema: 2
contests:
  WW-DIGI:
    name: World Wide Digi DX Contest
    bands: [160M, 80M, 40M, 20M, 15M, 10M]
    modes: [FT4, FT8]
    setup_fields:
      - id: param-grid
        key: Grid
        label: Four-character Grid Square
        type: String:4
        required: true
        regex: '^[A-Ra-r]{2}\d{2}$'
        help_text: Four-character Maidenhead grid square.
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, MULTI-OP, CHECKLOG]}
      - {id: header-category-band, preset: category-band, default: ALL, valid_values: [ALL, 160M, 80M, 40M, 20M, 15M, 10M]}
      - {id: header-category-power, preset: category-power, default: HIGH, valid_values: [QRP, LOW, HIGH]}
      - {id: header-category-transmitter, preset: category-transmitter, default: ONE, valid_values: [ONE, UNLIMITED], multi_single_has_mult_transmitter: true}
    exchange:
      - {id: grid-sent, label: Grid(s), type: String:4, adif: MY_GRIDSQUARE, direction: sent, fixed: true, source: Grid, regex: '^[A-Ra-r]{2}\d{2}$'}
      - {id: grid-received, label: Grid, type: String:4, adif: GRIDSQUARE, direction: received, regex: '^[A-Ra-r]{2}\d{2}$'}
    scoring:
      qso_points:
        category_band_param: CATEGORY-BAND
        grid_distance:
          station_grid_field: MY_GRIDSQUARE
          contact_grid_field: GRIDSQUARE
          base_points: 0
          kilometers_per_point: 3000
          minimum_distance_points: 1
      dupe_key: [CALL, BAND]
      multipliers:
        - {id: mult-grid-field, name: Grid Field, field: GRID_FIELD, key: [GRID_FIELD, BAND]}
    cabrillo:
      fixed_headers:
        - {id: fixed-category-mode, name: CATEGORY-MODE, value: DIGITAL}
      export_fields:
        - {id: export-location, key: LOCATION, label: Location, type: String:32, required: false}
        - {id: export-club, preset: export-club-optional}
        - {id: export-email, preset: export-email-optional}
        - {id: export-name, preset: export-name-optional}
        - {id: export-address, preset: export-address-optional}
        - {id: export-soapbox, preset: export-soapbox-optional}
    metadata:
      source: https://ww-digi.com/rules/
      notes: FT4 and FT8 contacts are scored once per band. QSO points are one plus one for each completed 3000 km between four-character grid-square centers; two-character grid fields are multipliers per band. Category, power, transmitter, band-change, and station restrictions remain operator-enforced.
