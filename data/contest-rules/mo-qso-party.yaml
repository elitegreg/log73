schema: 2
contests:
  MO-QSO-PARTY (In State):
    name: Missouri QSO Party (In State)
    profiles: [all-contest-bands]
    modes: [CW, PHONE, DIGITAL]
    value_sets:
      Missouri Counties: {values_from_file: missouri-counties.dat}
      States: {use: us-states, exclude: [MO]}
      Canadian Provinces: {use: canadian-provinces}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: Missouri County, type: String:3, required: true, in_sets: [Missouri Counties]}
      - {id: header-category-power, preset: category-power, default: LOW, valid_values: [QRP, LOW, HIGH]}
      - {id: header-category-station, preset: category-station, default: FIXED, valid_values: [FIXED, PORTABLE, MOBILE]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: county-sent, label: County, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [Missouri Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: exchange-received, label: Exchange, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Missouri Counties, States, Canadian Provinces, DX]}
    scoring:
      qso_points:
        rules: [{id: qso-phone, when: {field: MODE_CLASS, values: [PHONE]}, points: 1}, {id: qso-cw-digital, points: 2}]
      dupe_key: [CALL, BAND, MODE]
      multipliers:
        - {id: mult-county, name: Missouri County, field: SRX_STRING, key: [SRX_STRING], in_sets: [Missouri Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING], in_sets: [States]}
        - {id: mult-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING], in_sets: [Canadian Provinces]}
        - {id: mult-dx, name: DX, field: SRX_STRING, fixed_key: DX, in_sets: [DX]}
      bonus_points:
        - {id: bonus-w0ma, name: W0MA, field: CALL, key: [CALL], values: {W0MA: 100}}
        - {id: bonus-k0gq, name: K0GQ, field: CALL, key: [CALL], values: {K0GQ: 100}}
    metadata:
      source: https://www.w0ma.org/mo_qso_party/results/thisyear/moqp-2026-rules-final.pdf
      notes: The electronic-submission and timed-band bonuses are not modeled; mobile county qualification remains operator-enforced.
  MO-QSO-PARTY:
    name: Missouri QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: 'State, Province, or DX', type: String:3, required: true, in_sets: [States, Canadian Provinces, DX], before: header-category-power}
    exchange:
      - {id: county-sent, remove: true}
      - {id: location-sent, label: Location, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [States, Canadian Provinces, DX], after: rst-sent}
      - {id: exchange-received, remove: true}
      - {id: county-received, label: Missouri County, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Missouri Counties], after: rst-received}
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-province, remove: true}
        - {id: mult-dx, remove: true}
    extends: MO-QSO-PARTY (In State)
