schema: 2
contests:
  ARRL-SS-CW:
    name: ARRL November Sweepstakes (CW)
    value_sets:
      ARRL Sections:
        use: arrl-sections
      RAC Sections:
        use: rac-sections
    setup_fields:
      - id: param-precedence
        key: Precedence
        label: Precedence
        type: String:1
        required: true
        valid_values: [A, B, M, Q, S, U]
        help_text: Q=single-op QRP, A=single-op low, B=single-op high, U=single-op unlimited, M=multioperator, S=school club.
      - id: param-check
        key: Check
        label: Check
        type: String:2
        required: true
        regex: ^\d{2}$
        help_text: Last two digits of the year the operator or station was first licensed.
      - id: param-section
        key: Section
        label: ARRL/RAC Section
        type: String:3
        required: true
        in_sets: [ARRL Sections, RAC Sections]
      - id: header-category-operator
        preset: category-operator
        required: false
        valid_values: [SINGLE-OP, MULTI-OP, SCHOOL]
      - id: header-category-assisted
        preset: category-assisted
        required: false
        valid_values: [ASSISTED, NON-ASSISTED]
      - id: header-category-power
        preset: category-power
        required: false
        valid_values: [HIGH, LOW, QRP]
      - id: header-category-transmitter
        preset: category-transmitter
        required: false
        valid_values: [ONE]
      - id: header-category-overlay
        preset: category-overlay
        type: String:16
        required: false
        valid_values: [LIMITED-ANTENNAS]
    exchange:
      - id: serial-sent
        label: Serial(s)
        type: Serial:4
        adif: STX
        direction: sent
      - id: prec-sent
        label: Prec(s)
        type: String:1
        adif: STX_STRING
        direction: sent
        fixed: true
        valid_values: [A, B, M, Q, S, U]
        source: Precedence
      - id: check-sent
        label: Check(s)
        type: String:2
        adif: MY_CHECK
        direction: sent
        fixed: true
        regex: ^\d{2}$
        source: Check
      - id: sect-sent
        label: Sect(s)
        type: String:3
        adif: MY_ARRL_SECT
        direction: sent
        fixed: true
        in_sets: [ARRL Sections, RAC Sections]
        source: Section
      - id: serial-received
        label: Serial
        type: Serial:4
        adif: SRX
        direction: received
      - id: prec-received
        label: Prec
        type: String:1
        adif: SRX_STRING
        direction: received
        valid_values: [A, B, M, Q, S, U]
      - id: check-received
        label: Check
        type: String:2
        adif: CHECK
        direction: received
        regex: ^\d{2}$
      - id: sect-received
        label: Sect
        type: String:3
        adif: ARRL_SECT
        direction: received
        in_sets: [ARRL Sections, RAC Sections]
    scoring:
      qso_points:
        points: 2
      dupe_key:
        - CALL
      multipliers:
        - {id: mult-arrl-rac-section, name: ARRL/RAC Section, field: ARRL_SECT, key: [ARRL_SECT], in_sets: [ARRL Sections, RAC Sections]}
    cabrillo:
      fixed_headers:
        - {id: fixed-category-mode, name: CATEGORY-MODE, value: CW}
      export_fields: []
    metadata:
      source: https://contests.arrl.org/ContestRules/SS-Rules.pdf
      notes: >-
        CW only. Each station may be worked once regardless of band. The callsign is included
        automatically in Cabrillo QSO records between the sent and received exchanges.
    profiles:
      - hf-bands
      - cw-mode
  ARRL-SS-SSB:
    name: ARRL November Sweepstakes (SSB)
    modes:
      - SSB
    cabrillo:
      fixed_headers:
        - {value: SSB, id: fixed-category-mode}
    metadata:
      notes: >-
        SSB only. Each station may be worked once regardless of band. The callsign is included
        automatically in Cabrillo QSO records between the sent and received exchanges.
    extends: ARRL-SS-CW
