schema: 2
contests:
  CO-QSO-PARTY (In State):
    name: Colorado QSO Party (In State)
    bands: [80M, 40M, 20M, 15M, 10M, 6M, 2M]
    modes: [CW, PHONE]
    value_sets:
      Colorado Counties: {values_from_file: colorado-counties.dat}
      States: {use: us-states}
      Canadian Provinces: {use: canadian-provinces}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: Colorado County, type: String:3, required: true, in_sets: [Colorado Counties]}
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, MULTI-OP]}
      - {id: header-category-power, preset: category-power, default: LOW, valid_values: [QRP, LOW, HIGH]}
      - {id: header-category-station, preset: category-station, default: FIXED, valid_values: [FIXED, MOBILE, PORTABLE]}
      - {id: header-category-mode, preset: category-mode, default: MIXED, valid_values: [CW, PHONE, MIXED]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: county-sent, label: County(s), type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [Colorado Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: exchange-received, label: Exchange, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Colorado Counties, States, Canadian Provinces, DX]}
    scoring:
      qso_points: {points: 2}
      dupe_key: [CALL, BAND, MODE_CLASS, STX_STRING]
      multipliers:
        - {id: mult-county, name: Colorado County, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [Colorado Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [States]}
        - {id: mult-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [Canadian Provinces]}
        - {id: mult-dx, name: DX, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [DX]}
    metadata:
      source: https://coloradoqsoparty.org/getting-started/rules/
      notes: Colorado mobile/portable county-activation bonuses require 15 QSOs per county and are not scored automatically.
  CO-QSO-PARTY:
    name: Colorado QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: 'State, Province, or DX', type: String:3, required: true, in_sets: [States, Canadian Provinces, DX], before: header-category-operator}
      - {id: header-category-operator, after: param-location}
    exchange:
      - {id: county-sent, remove: true}
      - {id: exchange-received, remove: true}
      - {id: location-sent, label: Location(s), type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [States, Canadian Provinces, DX], after: rst-sent}
      - {id: rst-received, after: location-sent}
      - {id: county-received, label: County, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Colorado Counties], after: rst-received}
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-province, remove: true}
        - {id: mult-dx, remove: true}
    metadata:
      notes: Outside-Colorado stations score Colorado counties once per mode.
    extends: CO-QSO-PARTY (In State)
