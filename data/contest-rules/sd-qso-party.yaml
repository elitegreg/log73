schema: 2
contests:
  SD-QSO-PARTY (In State):
    name: South Dakota QSO Party (In State)
    profiles: [all-contest-bands]
    modes: [CW, PHONE]
    value_sets:
      South Dakota Counties: {values_from_file: south-dakota-counties.dat}
      States: {use: us-states, exclude: [SD]}
      Canadian Provinces: {use: canadian-provinces}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: South Dakota County, type: String:4, required: true, in_sets: [South Dakota Counties]}
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, MULTI-OP]}
      - {id: header-category-power, preset: category-power, default: LOW, valid_values: [QRP, LOW, HIGH]}
      - {id: header-category-mode, preset: category-mode, default: MIXED, valid_values: [CW, PHONE, MIXED]}
      - {id: header-category-station, preset: category-station, default: FIXED, valid_values: [FIXED, MOBILE, ROVER, PORTABLE]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: county-sent, label: County(s), type: String:4, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [South Dakota Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: exchange-received, label: Exchange, type: String:4, adif: SRX_STRING, direction: received, in_sets: [South Dakota Counties, States, Canadian Provinces, DX]}
    scoring:
      qso_points:
        rules: [{id: qso-phone, when: {field: MODE_CLASS, values: [PHONE]}, points: 1}, {id: qso-cw, points: 2}]
      dupe_key: [CALL, BAND, MODE, STX_STRING, SRX_STRING]
      multipliers:
        - {id: mult-sd-county, name: South Dakota County, field: SRX_STRING, key: [SRX_STRING], in_sets: [South Dakota Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING], in_sets: [States]}
        - {id: mult-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING], in_sets: [Canadian Provinces]}
        - {id: mult-dxcc, name: DXCC Entity, field: DXCC, key: [DXCC], exclude_values: ['1', '291']}
      bonus_points:
        - {id: bonus-w0ojy, name: W0OJY, field: CALL, key: [CALL], values: {W0OJY: 100}}
    metadata:
      source: https://pdarc.org/sd-qso-party
      notes: South Dakota counties count once as multipliers, and the W0OJY bonus applies once.
  SD-QSO-PARTY:
    name: South Dakota QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: 'State, Province, or DX', type: String:4, required: true, in_sets: [States, Canadian Provinces, DX], before: header-category-operator}
    exchange:
      - {id: county-sent, remove: true}
      - {id: location-sent, label: Location, type: String:4, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [States, Canadian Provinces, DX], after: rst-sent}
      - {id: exchange-received, remove: true}
      - {id: county-received, label: South Dakota County, type: String:4, adif: SRX_STRING, direction: received, in_sets: [South Dakota Counties], after: rst-received}
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-province, remove: true}
        - {id: mult-dxcc, remove: true}
    metadata:
      notes: Outside-South-Dakota stations score South Dakota counties only.
    extends: SD-QSO-PARTY (In State)
