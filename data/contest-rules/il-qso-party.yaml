schema: 2
contests:
  IL-QSO-PARTY (In State):
    name: Illinois QSO Party (In State)
    profiles: [hf-vhf-bands]
    modes: [CW, PHONE, DIGITAL]
    value_sets:
      Illinois Counties: {values_from_file: illinois-counties.dat}
      States: {use: us-states, exclude: [IL]}
      Canadian Provinces: {use: canadian-provinces}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: Illinois County, type: String:4, required: true, in_sets: [Illinois Counties]}
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, MULTI-OP]}
      - {id: header-category-power, preset: category-power, default: LOW, valid_values: [QRP, LOW, HIGH]}
      - {id: header-category-mode, preset: category-mode, default: MIXED, valid_values: [CW, PHONE, MIXED]}
      - {id: header-category-station, preset: category-station, default: FIXED, valid_values: [FIXED, MOBILE, PORTABLE, ROVER]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: county-sent, label: County(s), type: String:4, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [Illinois Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: exchange-received, label: Exchange, type: String:4, adif: SRX_STRING, direction: received, in_sets: [Illinois Counties, States, Canadian Provinces, DX]}
    scoring:
      qso_points:
        rules: [{id: qso-phone, when: {field: MODE_CLASS, values: [PHONE]}, points: 1}, {id: qso-cw-digital, points: 2}]
      dupe_key: [CALL, BAND, MODE, STX_STRING, SRX_STRING]
      multipliers:
        - {id: mult-illinois-county, name: Illinois County, field: SRX_STRING, key: [SRX_STRING], in_sets: [Illinois Counties]}
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING], in_sets: [States]}
        - {id: mult-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING], in_sets: [Canadian Provinces]}
        - {id: mult-dxcc, name: DXCC Entity, field: DXCC, key: [DXCC], exclude_values: ['1', '291'], max_count: 5}
    metadata:
      source: https://w9awe.org/ilqp/
      notes: Illinois entrants score each Illinois county, other US states, Canadian provinces, and the first five DXCC entities; DX contacts beyond the first five still score QSO points.
  IL-QSO-PARTY:
    name: Illinois QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: 'State, Province, or DX', type: String:4, required: true, in_sets: [States, Canadian Provinces, DX], before: header-category-operator}
    exchange:
      - {id: county-sent, remove: true}
      - {id: location-sent, label: Location, type: String:4, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [States, Canadian Provinces, DX], after: rst-sent}
      - {id: exchange-received, remove: true}
      - {id: county-received, label: Illinois County, type: String:4, adif: SRX_STRING, direction: received, in_sets: [Illinois Counties], after: rst-received}
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-province, remove: true}
        - {id: mult-dxcc, remove: true}
    metadata:
      notes: Outside-Illinois stations score Illinois counties once each.
    extends: IL-QSO-PARTY (In State)
