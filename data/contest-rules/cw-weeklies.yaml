schema: 2
contests:
  K1USNSST:
    scoring:
      multipliers:
        - {id: mult-qth, name: QTH, field: SRX_STRING, key: [SRX_STRING]}
    name: K1USN SST
    value_sets: {}
    setup_fields:
      - id: param-name
        key: NAME
        label: Operator Name
        type: String:20
        required: true
        preserve_case: true
      - id: param-qth
        key: QTH
        label: State/Province/DX
        type: String:8
        required: true
        help_text: Use state/province abbreviation, or DX for DX stations.
    exchange:
      - id: name-sent
        label: Name(s)
        type: String:20
        adif: MY_NAME
        direction: sent
        fixed: true
        source: NAME
      - id: qth-sent
        label: QTH(s)
        type: String:8
        adif: STX_STRING
        direction: sent
        fixed: true
        source: QTH
      - id: name-received
        label: Name
        type: String:20
        adif: NAME
        direction: received
      - id: qth-received
        label: QTH
        type: String:8
        adif: SRX_STRING
        direction: received
    metadata:
      source: https://www.k1usn.com/sst_rules.html
      notes: >-
        Exchange is name and state/province/DX. Received operator name is stored in ADIF NAME; sent
        operator name is stored as MY_NAME. DXCC-specific SST multiplier handling is approximated
        from the entered QTH value.
    profiles:
      - cw-weekly
  MST:
    name: MST (Medium Speed Test)
    value_sets: {}
    setup_fields:
      - id: param-name
        key: NAME
        label: Operator Name
        type: String:20
        required: true
        preserve_case: true
    exchange:
      - id: serial-sent
        label: Serial(s)
        type: Serial:4
        adif: STX
        direction: sent
        fixed: true
      - id: name-sent
        label: Name(s)
        type: String:20
        adif: MY_NAME
        direction: sent
        fixed: true
        source: NAME
      - id: serial-received
        label: Serial
        type: Serial:4
        adif: SRX
        direction: received
      - id: name-received
        label: Name
        type: String:20
        adif: NAME
        direction: received
    metadata:
      source: https://internationalcwcouncil.org/mst-contest/
      notes: >-
        Exchange is serial number and name. Sent and received serial numbers are stored in ADIF STX
        and SRX; received names are stored in ADIF NAME.
    profiles:
      - cw-weekly
  CWT:
    scoring:
      multipliers:
        - {id: mult-callsign, name: Callsign, field: CALL, key: [CALL]}
    name: CWOps CWT
    value_sets: {}
    setup_fields:
      - id: param-name
        key: NAME
        label: First Name
        type: String:20
        required: true
        preserve_case: true
      - id: param-exchange
        key: EXCHANGE
        label: Member Number/SPC/DX/CWA
        type: String:16
        required: true
        help_text: CWops member number, state/province/DX prefix for non-members, or CWA.
    exchange:
      - id: name-sent
        label: Name(s)
        type: String:20
        adif: MY_NAME
        direction: sent
        fixed: true
        source: NAME
      - id: exchange-sent
        label: Exchange(s)
        type: String:16
        adif: STX_STRING
        direction: sent
        fixed: true
        source: EXCHANGE
      - id: name-received
        label: Name
        type: String:20
        adif: NAME
        direction: received
      - id: exchange-received
        label: Exchange
        type: String:16
        adif: SRX_STRING
        direction: received
    metadata:
      source: https://cwops.org/cwops-tests/
      notes: >-
        Exchange is first name plus CWops member number; non-members send first name plus
        state/province/DX country prefix, and CW Academy students send CWA. Score is modeled as 1
        point per QSO times unique callsigns worked.
    profiles:
      - cw-weekly
