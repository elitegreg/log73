schema: 2
contests:
  ARRL-FIELD-DAY:
    name: ARRL Field Day
    modes:
      - SSB
      - FM
      - CW
      - DATA
    value_sets:
      DX:
        use: dx
      ARRL Sections:
        use: arrl-sections
      RAC Sections:
        use: rac-sections
    setup_fields:
      - id: param-class
        key: Class
        label: Class
        type: String:3
        required: true
        regex: ^\d+[A-F]$
      - id: param-section
        key: Section
        label: Section
        type: String:3
        required: true
        in_sets: [ARRL Sections, RAC Sections]
      - id: header-category-operator
        preset: category-operator
        valid_values: [SINGLE-OP, MULTI-OP]
      - id: header-category-power
        preset: category-power
        valid_values: [HIGH, LOW, QRP]
      - id: header-category-station
        preset: category-station
        valid_values: [FIXED, MOBILE, PORTABLE]
      - id: header-category-transmitter
        preset: category-transmitter
        valid_values: [ONE, UNLIMITED]
    exchange:
      - id: class-sent
        label: Class(s)
        type: String:3
        adif: STX_STRING
        direction: sent
        fixed: true
        regex: ^\d+[A-F]$
        source: Class
      - id: section-sent
        label: Section(s)
        type: String:3
        adif: MY_ARRL_SECT
        direction: sent
        fixed: true
        in_sets: [ARRL Sections, RAC Sections, DX]
        source: Section
      - id: class-received
        label: Class
        type: String:3
        adif: CLASS
        direction: received
        regex: ^\d+[A-F]$
      - id: section-received
        label: Section
        type: String:3
        adif: ARRL_SECT
        direction: received
        in_sets: [ARRL Sections, RAC Sections, DX]
    scoring:
      qso_points:
        rules: [{id: qso-rule-1, when: {field: MODE, values: [SSB, FM]}, points: 1}, {id: qso-rule-2, points: 2}]
      dupe_key:
        - CALL
        - BAND
        - MODE
      param_multipliers:
        - {id: param-mult-category-power, param: CATEGORY-POWER, values: {HIGH: 1, LOW: 2, QRP: 5}}
    cabrillo:
      fixed_headers:
        - {id: fixed-category-band, name: CATEGORY-BAND, value: ALL}
        - {id: fixed-category-mode, name: CATEGORY-MODE, value: ALL}
      export_fields:
        - {id: export-club, preset: export-club-optional}
        - {id: export-email, key: EMAIL, label: Email, type: String:75, regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$', preserve_case: true}
        - {id: export-location, key: LOCATION, label: Location, type: String:32, help_text: 'State, province, or DX'}
        - {id: export-name, key: NAME, label: Name, type: String:75, preserve_case: true}
        - {id: export-address, key: ADDRESS, label: Address, type: String:45, widget: textarea, max_lines: 6, preserve_case: true}
        - {id: export-soapbox, preset: export-soapbox-optional}
    profiles:
      - hf-vhf-bands
