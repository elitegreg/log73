schema: 2
contests:
  ARRL-10:
    name: ARRL 10-Meter Contest
    bands:
      - 10M
    modes:
      - CW
      - SSB
    value_sets:
      US States:
        use: us-states
      District of Columbia:
        use: district-of-columbia
      ARRL 10 Canadian Multipliers:
        values_from_file: arrl-10-canadian-multipliers.dat
      ARRL 10 Mexican Multipliers:
        values_from_file: arrl-10-mexican-multipliers.dat
      ARRL 10 W/VE/XE DXCC:
        values: ['1', '6', '50', '110', '291']
      ITU Regions:
        values: ['1', '2', '3']
    setup_fields:
      - id: param-location
        key: Location
        label: State, Province, or Mexican State
        type: String:3
        required: true
        in_sets: [US States, District of Columbia, ARRL 10 Canadian Multipliers, ARRL 10 Mexican Multipliers]
      - id: header-category-operator
        preset: category-operator
        type: String:24
        default: SINGLE-OP
        valid_values: [SINGLE-OP, SINGLE-OP-UNLIMITED, MULTI-OP, CHECKLOG]
      - id: header-category-assisted
        preset: category-assisted
        default: NON-ASSISTED
        valid_values: [ASSISTED, NON-ASSISTED]
      - id: header-category-power
        preset: category-power
        default: LOW
        valid_values: [QRP, LOW, HIGH]
      - id: header-category-mode
        preset: category-mode
        default: MIXED
        valid_values: [MIXED, CW, SSB]
      - id: header-category-transmitter
        preset: category-transmitter
        default: ONE
        valid_values: [ONE]
      - id: header-category-overlay
        preset: category-overlay
        required: false
        valid_values: [LIMITED-ANTENNAS]
    exchange:
      - id: rst-sent
        preset: rst-sent
      - id: location-sent
        label: Location(s)
        type: String:3
        adif: STX_STRING
        direction: sent
        fixed: true
        in_sets: [US States, District of Columbia, ARRL 10 Canadian Multipliers, ARRL 10 Mexican Multipliers]
        source: Location
      - id: rst-received
        preset: rst-received
      - id: location-received
        label: Location
        type: String:4
        adif: SRX_STRING
        direction: received
        regex: ^\d{1,4}$
        valid_values_or_regex: true
        in_sets: [US States, District of Columbia, ARRL 10 Canadian Multipliers, ARRL 10 Mexican Multipliers, ITU Regions]
    scoring:
      qso_points:
        rules: [{id: qso-rule-1, when: {field: MODE_CLASS, values: [PHONE]}, points: 2}, {id: qso-rule-2, when: {field: MODE_CLASS, values: [CW]}, points: 4}]
      dupe_key:
        - CALL
        - MODE_CLASS
      multipliers:
        - {id: mult-location, name: Location, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [US States, District of Columbia, ARRL 10 Canadian Multipliers, ARRL 10 Mexican Multipliers], when: {field: DXCC, in_sets: [ARRL 10 W/VE/XE DXCC]}, when_all: [{field: CALL, exclude_suffixes: [/MM]}]}
        - {id: mult-dxcc-entity, name: DXCC Entity, field: DXCC, key: [DXCC, MODE_CLASS], when: {field: DXCC, exclude_in_sets: [ARRL 10 W/VE/XE DXCC]}, when_all: [{field: CALL, exclude_suffixes: [/MM]}]}
        - {id: mult-itu-region, name: ITU Region, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [ITU Regions], when: {field: CALL, suffixes: [/MM]}}
    cabrillo:
      fixed_headers:
        - {id: fixed-category-band, name: CATEGORY-BAND, value: 10M}
      export_fields:
        - {id: export-location, key: LOCATION, label: Location, type: String:32, required: false, help_text: 'State, province, Mexican state, or DXCC entity.'}
        - {id: export-club, preset: export-club-optional}
        - {id: export-email, key: EMAIL, label: Email, type: String:75, required: false, regex: '^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$', preserve_case: true}
        - {id: export-name, preset: export-name-optional}
        - {id: export-address, preset: export-address-optional}
        - {id: export-soapbox, preset: export-soapbox-optional}
    metadata:
      source: >-
        https://www.arrl.org/files/file/Contest%20Rules%20PDFs/2026/10%20Meter%20Rules%20v%202_0%20-%202026.pdf
      notes: >-
        CW and Phone on 10 meters only. Contacts count once per mode; operating and category
        restrictions remain operator-enforced.
  ARRL-10 (DX):
    name: ARRL 10-Meter Contest (DX)
    setup_fields:
      - id: param-location
        remove: true
    exchange:
      - id: location-sent
        remove: true
      - id: serial-sent
        label: Serial(s)
        type: Serial:4
        adif: STX
        direction: sent
        after: rst-sent
      - id: rst-received
        after: serial-sent
    extends: ARRL-10
  ARRL-10 (/MM):
    name: ARRL 10-Meter Contest (/MM)
    setup_fields:
      - id: param-location
        remove: true
      - id: param-itu-region
        key: ITU Region
        label: ITU Region
        type: String:1
        required: true
        in_sets: [ITU Regions]
        before: header-category-operator
      - id: header-category-operator
        after: param-itu-region
    exchange:
      - id: location-sent
        remove: true
      - id: itu-region-sent
        label: ITU Region(s)
        type: String:1
        adif: APP_LOG73_STX_ITU_REGION
        direction: sent
        fixed: true
        in_sets: [ITU Regions]
        source: ITU Region
        after: rst-sent
      - id: rst-received
        after: itu-region-sent
    extends: ARRL-10
