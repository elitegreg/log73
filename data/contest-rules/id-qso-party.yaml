schema: 2
contests:
  ID-QSO-PARTY (In State):
    name: Idaho QSO Party (In State)
    bands: [160M, 80M, 40M, 20M, 15M, 10M]
    modes: [CW, PHONE, DIGITAL]
    value_sets:
      Idaho Counties: {values_from_file: idaho-counties.dat}
      States: {use: us-states, exclude: [ID]}
      Canadian Provinces: {use: canadian-provinces}
      DX: {use: dx}
    setup_fields:
      - {id: param-county, key: County, label: Idaho County, type: String:3, required: true, in_sets: [Idaho Counties]}
      - {id: header-category-operator, preset: category-operator, default: SINGLE-OP, valid_values: [SINGLE-OP, MULTI-OP, MOBILE, ROVER]}
      - {id: header-category-power, preset: category-power, default: HIGH, valid_values: [HIGH, LOW, QRP]}
      - {id: header-category-mode, preset: category-mode, default: MIXED, valid_values: [CW, PHONE, DIGITAL, MIXED]}
    exchange:
      - {id: rst-sent, preset: rst-sent}
      - {id: county-sent, label: County, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: County, in_sets: [Idaho Counties]}
      - {id: rst-received, preset: rst-received}
      - {id: exchange-received, label: 'State, Province, or DX', type: String:3, adif: SRX_STRING, direction: received, in_sets: [States, Canadian Provinces, DX]}
    scoring:
      qso_points:
        rules: [{id: qso-phone, when: {field: MODE_CLASS, values: [PHONE]}, points: 1}, {id: qso-cw-digital, points: 2}]
      dupe_key: [CALL, BAND, MODE_CLASS, STX_STRING, SRX_STRING]
      multipliers:
        - {id: mult-state, name: State, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [States]}
        - {id: mult-province, name: Canadian Province, field: SRX_STRING, key: [SRX_STRING, MODE_CLASS], in_sets: [Canadian Provinces]}
        - {id: mult-dx, name: DXCC Entity, field: DXCC, key: [DXCC, MODE_CLASS], exclude_values: ['1', '6', '110', '291']}
    metadata:
      source: https://idahoqsoparty.org/rules.htm
      notes: >-
        Based on the latest published 2026 rules. FT8/FT4 is excluded. QRP's five-point-per-QSO
        override, dormant-county bonuses, and full rover/county-line scoring are not automatically
        scored; ordinary phone/CW/digital points and mode-scoped multipliers are supported.
    profiles: [hf-bands]
  ID-QSO-PARTY:
    name: Idaho QSO Party
    setup_fields:
      - {id: param-county, remove: true}
      - {id: param-location, key: Location, label: 'State, Province, or DX', type: String:3, required: true, in_sets: [States, Canadian Provinces, DX], before: header-category-operator}
    exchange:
      - {id: county-sent, remove: true}
      - {id: exchange-received, remove: true}
      - {id: location-sent, label: Location, type: String:3, adif: STX_STRING, direction: sent, fixed: true, source: Location, in_sets: [States, Canadian Provinces, DX], after: rst-sent}
      - {id: rst-received, after: location-sent}
      - {id: county-received, label: Idaho County, type: String:3, adif: SRX_STRING, direction: received, in_sets: [Idaho Counties], after: rst-received}
    scoring:
      multipliers:
        - {id: mult-state, remove: true}
        - {id: mult-province, remove: true}
        - {id: mult-dx, remove: true}
    extends: ID-QSO-PARTY (In State)
