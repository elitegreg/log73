[workspace]
members = ["cargo:."]
packages = ["log73-launcher", "log73-radio-client"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The Windows installer templates and release workflow add package-specific assets.
allow-dirty = ["ci", "msi"]
# The installers to generate for each app
installers = ["msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Build frontend assets before Rust binaries so log73-backend embeds the latest dist/ output
github-build-setup = "../dist-build-setup.yml"
[dist.dependencies.apt]
pkg-config = "*"
libudev-dev = "*"
libasound2-dev = "*"
"libpipewire-0.3-dev" = "*"

[dist.github-custom-runners]
global = "ubuntu-24.04"
"x86_64-unknown-linux-gnu" = "ubuntu-24.04"
"aarch64-unknown-linux-gnu" = "ubuntu-24.04-arm"
